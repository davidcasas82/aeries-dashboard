name: Daily Grade Scrape

on:
  schedule:
    # Pacific times shift one hour in winter (PST). GitHub cron is UTC.
    # Minute 7 avoids GitHub dropping :00 slots.
    - cron: '7 9 * * *'    # ~2:07am PT — overnight catch-up
    - cron: '7 3 * * *'    # ~8:07pm PT — evening, before parents usually look
  workflow_dispatch:
    inputs:
      grok_only:
        description: 'Regenerate AI briefings only (skip Aeries scrape)'
        type: boolean
        default: false
      probe_attendance:
        description: 'Debug: dump Attendance page structure only'
        type: boolean
        default: false
      probe_gradebook:
        description: 'Debug: dump GradebookDetails dropdown terms only'
        type: boolean
        default: false
      attendance_only:
        description: 'Refresh absences/tardies only (no grades/Grok)'
        type: boolean
        default: false

concurrency:
  group: grades-scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Pull latest main
        run: git pull --rebase origin main

      - name: Run scraper
        env:
          AERIES_EMAIL: ${{ secrets.AERIES_EMAIL }}
          AERIES_PASSWORD: ${{ secrets.AERIES_PASSWORD }}
          STUDENT_1_SN: ${{ secrets.STUDENT_1_SN }}
          STUDENT_1_NAME: ${{ secrets.STUDENT_1_NAME }}
          STUDENT_1_SCHOOL_CODE: ${{ secrets.STUDENT_1_SCHOOL_CODE }}
          STUDENT_2_SN: ${{ secrets.STUDENT_2_SN }}
          STUDENT_2_NAME: ${{ secrets.STUDENT_2_NAME }}
          STUDENT_2_SCHOOL_CODE: ${{ secrets.STUDENT_2_SCHOOL_CODE }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          PYTHONUNBUFFERED: "1"
          # Optional override only. Leave unset to auto-pause from TUSD school calendar
          # (school_calendar.json / live calendars-school-year page).
          # true = force pause Aeries + Grok; false = force scrape even in summer
          SUMMER_BREAK: ${{ vars.SUMMER_BREAK }}
        run: |
          if [ "${{ inputs.probe_attendance }}" = "true" ]; then
            python scraper.py --probe-attendance
          elif [ "${{ inputs.probe_gradebook }}" = "true" ]; then
            python scraper.py --probe-gradebook
          elif [ "${{ inputs.attendance_only }}" = "true" ]; then
            python scraper.py --attendance-only
          elif [ "${{ inputs.grok_only }}" = "true" ]; then
            python scraper.py --grok-only
          else
            python scraper.py
          fi

      - name: Commit updated data
        if: ${{ inputs.probe_attendance != true && inputs.probe_gradebook != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add grades_data.json grade_history.json
          git diff --cached --quiet || git commit -m "Update grades data"
          git push
