<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f1ea">
    <meta name="color-scheme" content="light">
    <title>Casas Family Grade Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            /* Light “Insights” theme — warm cream + teal */
            --bg: #f4f1ea;
            --surface: #faf8f4;
            --surface-2: #ffffff;
            --border: rgba(40, 40, 35, 0.08);
            --border-strong: rgba(40, 40, 35, 0.12);
            --text: #1c1c1a;
            --text-2: #5c5c56;
            --text-3: #8a8a82;
            --teal: #1f5c52;
            --teal-mid: #3d8a7a;
            --teal-soft: #c8e6df;
            --teal-wash: rgba(31, 92, 82, 0.08);
            --green: #2a7a5c;
            --green-soft: rgba(42, 122, 92, 0.12);
            --amber: #a67c1a;
            --amber-soft: rgba(166, 124, 26, 0.12);
            --red: #c45c3e;
            --red-soft: rgba(196, 92, 62, 0.12);
            --blue: #3d8a7a;
            --shadow-sm: 0 1px 2px rgba(40, 40, 35, 0.04);
            --shadow-card: 0 1px 2px rgba(40, 40, 35, 0.04), 0 8px 24px rgba(40, 40, 35, 0.05);
            --shadow-raised: 0 4px 20px rgba(40, 40, 35, 0.08);
            --touch-min: 56px;
            --top-bar-h: 64px;
            --radius: 16px;
            --radius-sm: 12px;
            --content-max: min(1680px, calc(100vw - 20px));
            --row-pad-y: 16px;
            --row-pad-x: 18px;
            --fs-body: 20px;
            --fs-title: 26px;
            --fs-headline: clamp(26px, 3.2vw, 36px);
            --fs-class: 22px;
            --fs-grade: 28px;
            --fs-snap: 18px;
            --fs-meta: 16px;
            --fs-small: 15px;
            --fs-label: 13px;
        }

        html {
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: var(--fs-body);
            line-height: 1.4;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        }

        /* ── Top bar ── */
        .top-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: var(--top-bar-h);
            padding: 8px 16px;
            padding-top: calc(8px + env(safe-area-inset-top, 0px));
            background: rgba(244, 241, 234, 0.9);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }

        .top-bar-left { flex: 1; min-width: 0; }

        .top-bar-title {
            font-size: var(--fs-title);
            font-weight: 650;
            letter-spacing: -0.3px;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .last-updated {
            font-size: var(--fs-small);
            color: var(--text-3);
            margin-top: 1px;
        }

        .settings-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text-2);
            cursor: pointer;
            border-radius: var(--radius-sm);
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }

        .settings-btn:hover { color: var(--text); background: var(--surface); }
        .settings-btn svg { width: 18px; height: 18px; }

        /* ── Student switch ── */
        .student-picker {
            display: flex;
            gap: 0;
            background: var(--surface);
            border-radius: 999px;
            padding: 5px;
            margin: 8px auto 0;
            border: 1px solid var(--border);
            max-width: var(--content-max);
            width: var(--content-max);
            box-shadow: var(--shadow-sm);
        }

        .student-seg {
            flex: 1;
            min-height: var(--touch-min);
            border: none;
            background: none;
            color: var(--text-2);
            font-size: var(--fs-body);
            font-weight: 600;
            cursor: pointer;
            border-radius: 999px;
            transition: background 0.12s, color 0.12s, box-shadow 0.12s;
        }

        .student-seg:hover { color: var(--text); }
        .student-seg.active {
            background: var(--surface-2);
            color: var(--teal);
            box-shadow: var(--shadow-sm);
        }

        /* ── Sticky tonight ── */
        .tonight-sticky {
            position: sticky;
            top: calc(var(--top-bar-h) + env(safe-area-inset-top, 0px));
            z-index: 90;
            display: none;
            align-items: center;
            gap: 10px;
            margin: 0 auto;
            max-width: var(--content-max);
            width: var(--content-max);
            padding: 10px 16px;
            background: rgba(250, 248, 244, 0.95);
            border: 1px solid rgba(166, 124, 26, 0.22);
            border-top: none;
            border-radius: 0 0 var(--radius-sm) var(--radius-sm);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            text-align: left;
            color: inherit;
            font: inherit;
        }

        .tonight-sticky.visible { display: flex; }

        .tonight-sticky-label {
            font-size: var(--fs-label);
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--amber);
            flex-shrink: 0;
        }

        .tonight-sticky-text {
            font-size: var(--fs-meta);
            font-weight: 550;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── Main ── */
        .main-content {
            max-width: var(--content-max);
            width: var(--content-max);
            margin: 0 auto;
            padding: 10px 0 20px;
        }

        .dashboard { display: none; }
        .dashboard.active { display: block; }

        /* ── Masthead ── */
        .masthead {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px 16px;
            margin-bottom: 14px;
            box-shadow: var(--shadow-card);
        }

        .masthead-kicker {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 6px;
        }

        .masthead-kicker h2 {
            font-size: var(--fs-label);
            font-weight: 650;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-3);
        }

        .masthead-date {
            font-size: var(--fs-small);
            color: var(--text-3);
        }

        .masthead-headline {
            font-size: var(--fs-headline);
            font-weight: 650;
            line-height: 1.25;
            letter-spacing: -0.35px;
            color: var(--text);
        }

        .masthead-headline.muted {
            color: var(--text-2);
            font-weight: 500;
        }

        .masthead-tonight {
            margin-top: 12px;
            padding: 14px 16px;
            border-left: 4px solid var(--amber);
            background: var(--amber-soft);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        }

        .masthead-tonight .label {
            font-size: var(--fs-label);
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--amber);
            margin-bottom: 4px;
        }

        .masthead-tonight .text {
            font-size: calc(var(--fs-body) + 2px);
            font-weight: 600;
            line-height: 1.35;
            color: var(--text);
        }

        .masthead-wins {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .win-line {
            font-size: var(--fs-meta);
            color: var(--teal);
            line-height: 1.35;
            padding-left: 18px;
            position: relative;
        }

        .win-line::before {
            content: "✓";
            position: absolute;
            left: 0;
            font-weight: 700;
            font-size: var(--fs-label);
            top: 1px;
            color: var(--green);
        }

        .masthead-stats {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .masthead-stat {
            display: inline-flex;
            align-items: baseline;
            gap: 6px;
            padding: 8px 14px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 999px;
            box-shadow: var(--shadow-sm);
            font-size: var(--fs-small);
            color: var(--text-2);
        }

        .masthead-stat .stat-num {
            font-size: calc(var(--fs-body) + 2px);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .masthead-stat .stat-num-text {
            font-size: var(--fs-small);
            font-weight: 600;
            letter-spacing: 0;
        }

        .masthead-stat.warn .stat-num { color: var(--amber); }
        .masthead-stat.alert .stat-num { color: var(--red); }
        .masthead-stat.ok .stat-num { color: var(--teal); }

        .masthead-movers {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            align-items: center;
        }

        .movers-label {
            font-size: var(--fs-label);
            font-weight: 650;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: var(--text-3);
            margin-right: 2px;
        }

        .mover {
            display: inline-flex;
            align-items: baseline;
            gap: 5px;
            font-size: var(--fs-small);
            color: var(--text-2);
            max-width: 100%;
        }

        .mover .name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 10em;
        }

        .mover .delta {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .mover.up .delta { color: var(--teal); }
        .mover.down .delta { color: var(--red); }
        .mover.same .delta { color: var(--text-3); }

        .mover .win {
            font-size: var(--fs-label);
            color: var(--text-3);
        }

        /* ── Feed ── */
        .feed-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
            padding: 0 2px;
        }

        .feed-header h2 {
            font-size: var(--fs-label);
            font-weight: 650;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-3);
        }

        .feed-header .count {
            font-size: var(--fs-small);
            color: var(--text-3);
            font-weight: 500;
        }

        .class-feed {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .class-row {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-card);
            transition: border-color 0.12s, box-shadow 0.12s;
        }

        .class-row.expanded {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-raised);
        }

        .class-row-btn {
            display: grid;
            grid-template-columns: 4px 1fr auto;
            gap: 0 14px;
            width: 100%;
            min-height: 88px;
            padding: var(--row-pad-y) var(--row-pad-x) var(--row-pad-y) 0;
            border: none;
            background: none;
            cursor: pointer;
            text-align: left;
            color: inherit;
            font: inherit;
            align-items: stretch;
        }

        .class-row-btn:hover { background: rgba(31, 92, 82, 0.03); }
        .class-row-btn:active { background: rgba(31, 92, 82, 0.05); }

        .class-row.expanded .class-row-btn {
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
        }

        .row-chevron {
            width: 24px;
            height: 24px;
            margin-left: 6px;
            color: var(--text-3);
            flex-shrink: 0;
            transition: transform 0.15s ease;
            align-self: center;
        }

        .class-row.expanded .row-chevron {
            transform: rotate(180deg);
            color: var(--text-2);
        }

        .row-trail-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .urgency-bar {
            width: 4px;
            border-radius: 0 2px 2px 0;
            background: transparent;
            align-self: stretch;
            min-height: 100%;
        }

        .urgency-critical .urgency-bar { background: var(--red); }
        .urgency-watch .urgency-bar { background: var(--amber); }
        .urgency-strong .urgency-bar { background: var(--teal); }
        .urgency-ok .urgency-bar { background: rgba(40, 40, 35, 0.12); }

        .row-main {
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 3px;
            padding: 2px 0;
        }

        .row-title {
            display: flex;
            align-items: center;
            gap: 7px;
            min-width: 0;
        }

        .row-period {
            font-size: var(--fs-label);
            font-weight: 650;
            color: var(--text-3);
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        .row-name {
            font-size: var(--fs-class);
            font-weight: 650;
            color: var(--text);
            letter-spacing: -0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .row-missing {
            font-size: var(--fs-label);
            font-weight: 650;
            color: var(--red);
            background: var(--red-soft);
            padding: 3px 9px;
            border-radius: 999px;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .row-meta {
            font-size: var(--fs-snap);
            color: var(--text-2);
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .row-meta.critical { color: var(--red); }
        .row-meta.watch { color: var(--amber); }

        .row-trail {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
            flex-shrink: 0;
            min-width: 72px;
        }

        .row-grade {
            display: flex;
            align-items: baseline;
            gap: 5px;
            font-variant-numeric: tabular-nums;
        }

        .row-grade .letter {
            font-size: var(--fs-grade);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.3px;
        }

        .row-grade .pct {
            font-size: var(--fs-meta);
            font-weight: 550;
            color: var(--text-3);
        }

        .grade-a, .grade-b { color: var(--teal); }
        .grade-c { color: var(--amber); }
        .grade-d, .grade-f { color: var(--red); }
        .grade-none { color: var(--text-3); }

        .stat-tile .stat-value.grade-a,
        .stat-tile .stat-value.grade-b { color: var(--teal); }
        .stat-tile .stat-value.grade-c { color: var(--amber); }
        .stat-tile .stat-value.grade-d,
        .stat-tile .stat-value.grade-f { color: var(--red); }

        .row-trend {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .row-trend .micro-spark {
            display: block;
            width: 44px;
            height: 16px;
            flex-shrink: 0;
        }

        .row-delta {
            font-size: var(--fs-label);
            font-weight: 650;
            font-variant-numeric: tabular-nums;
            color: var(--text-3);
        }

        .row-delta.up { color: var(--teal); }
        .row-delta.down { color: var(--red); }

        /* ── Expanded class panel (self-contained) ── */
        .class-row-detail {
            display: none;
        }

        .class-row.expanded .class-row-detail {
            display: block;
            background: linear-gradient(180deg, rgba(244, 241, 234, 0.65), var(--bg));
            padding: 12px;
        }

        .class-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .panel-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        @media (max-width: 520px) {
            .panel-stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .stat-tile {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 12px 10px;
            min-width: 0;
            box-shadow: var(--shadow-sm);
        }

        .stat-tile .stat-label {
            font-size: var(--fs-label);
            font-weight: 650;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-3);
            margin-bottom: 4px;
        }

        .stat-tile .stat-value {
            font-size: var(--fs-grade);
            font-weight: 700;
            letter-spacing: -0.3px;
            font-variant-numeric: tabular-nums;
            color: var(--text);
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stat-tile .stat-value.sm {
            font-size: var(--fs-small);
            font-weight: 600;
        }

        .stat-tile .stat-value.up { color: var(--teal); }
        .stat-tile .stat-value.down { color: var(--red); }
        .stat-tile .stat-value.alert { color: var(--red); }

        .panel-block {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 14px 12px;
            box-shadow: var(--shadow-sm);
        }

        .panel-block-label {
            font-size: var(--fs-label);
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-3);
            margin-bottom: 8px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
        }

        .panel-block-label .count {
            font-weight: 650;
            letter-spacing: 0;
            text-transform: none;
            color: var(--text-3);
        }

        .panel-block-label.alert { color: var(--red); }
        .panel-block-label.alert .count { color: var(--red); }
        .panel-block-label.tonight { color: var(--amber); }

        .panel-block-tonight {
            background: var(--amber-soft);
            border-color: rgba(166, 124, 26, 0.18);
        }

        .panel-story {
            font-size: var(--fs-meta);
            color: var(--text-2);
            line-height: 1.45;
        }

        .panel-tonight-text {
            font-size: var(--fs-body);
            font-weight: 600;
            color: var(--text);
            line-height: 1.35;
        }

        .panel-meta-line {
            font-size: var(--fs-small);
            color: var(--text-3);
            line-height: 1.4;
            margin-top: 2px;
        }

        .panel-trend {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .panel-trend-chart {
            width: 100%;
            height: 48px;
            background: var(--teal-wash);
            border-radius: 10px;
            padding: 6px 8px;
        }

        .panel-trend-chart svg,
        .panel-spark {
            width: 100%;
            height: 36px;
            display: block;
        }

        .panel-trend-caption {
            font-size: var(--fs-small);
            color: var(--text-2);
            font-variant-numeric: tabular-nums;
        }

        .panel-trend-caption .delta.up { color: var(--teal); font-weight: 650; }
        .panel-trend-caption .delta.down { color: var(--red); font-weight: 650; }

        .panel-lists {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        @media (min-width: 640px) {
            .panel-lists.two-col {
                grid-template-columns: 1fr 1fr;
            }
            .panel-lists.two-col .panel-block.full {
                grid-column: 1 / -1;
            }
        }

        .panel-empty {
            font-size: var(--fs-small);
            color: var(--text-3);
            padding: 4px 0 2px;
        }

        /* ── Assignment rows ── */
        .list-panel { margin-top: 2px; }

        .week-label {
            font-size: var(--fs-label);
            font-weight: 600;
            color: var(--text-3);
            padding: 8px 0 4px;
        }

        .week-label:first-child { padding-top: 0; }

        .assignment-row {
            display: flex;
            align-items: flex-start;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            gap: 10px;
        }

        .assignment-row:last-child { border-bottom: none; }

        .assignment-date {
            font-size: var(--fs-label);
            font-weight: 650;
            color: var(--text-3);
            min-width: 52px;
            text-align: left;
            line-height: 1.25;
            flex-shrink: 0;
            padding-top: 2px;
            font-variant-numeric: tabular-nums;
        }

        .assignment-date.overdue { color: var(--red); }
        .assignment-date.today { color: var(--amber); }
        .assignment-date.this-week { color: var(--text-2); }

        .assignment-info { flex: 1; min-width: 0; }

        .assignment-info .title {
            font-size: var(--fs-meta);
            font-weight: 550;
            color: var(--text);
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .assignment-meta {
            font-size: var(--fs-label);
            color: var(--text-3);
            margin-top: 2px;
        }

        .assignment-score {
            text-align: right;
            min-width: 52px;
            flex-shrink: 0;
        }

        .assignment-score .score {
            font-size: var(--fs-meta);
            font-weight: 650;
            font-variant-numeric: tabular-nums;
        }

        .assignment-score .max {
            font-size: var(--fs-label);
            color: var(--text-3);
            margin-top: 1px;
        }

        .pts-badge {
            font-size: var(--fs-label);
            font-weight: 650;
            color: var(--text-2);
            background: var(--bg);
            padding: 2px 7px;
            border-radius: 8px;
            white-space: nowrap;
            border: 1px solid var(--border);
        }

        .badge {
            font-size: var(--fs-label);
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 8px;
            white-space: nowrap;
        }

        .badge-upcoming {
            background: var(--teal-wash);
            color: var(--teal);
        }

        .score-high { color: var(--teal); }
        .score-mid { color: var(--amber); }
        .score-low { color: var(--red); }
        .score-none { color: var(--text-3); font-weight: 400; }

        .panel-block .assignment-row:first-of-type { padding-top: 0; }
        .panel-block .list-panel { margin-top: 0; }

        /* ── Empty / loading ── */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-3);
            font-size: var(--fs-body);
        }

        .empty-state strong {
            display: block;
            color: var(--text);
            margin-bottom: 6px;
            font-size: var(--fs-title);
        }

        .loading-skeleton { padding: 8px 0; }

        .skel {
            background: linear-gradient(90deg, #ebe7df 25%, #f7f4ee 50%, #ebe7df 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s ease-in-out infinite;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
        }

        .skel-hero { height: 140px; margin-bottom: 14px; }
        .skel-row { height: 88px; margin-bottom: 10px; border-radius: var(--radius); }

        @keyframes shimmer {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        .summer-break-banner {
            background: var(--amber-soft);
            border: 1px solid rgba(166, 124, 26, 0.22);
            padding: 12px 14px;
            margin: 12px auto 0;
            max-width: var(--content-max);
            width: var(--content-max);
            font-size: var(--fs-meta);
            color: var(--amber);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-sm);
        }

        /* Keep masthead + attendance visible; only hide tonight sticky in summer */
        body.summer-break .tonight-sticky {
            display: none !important;
        }

        .empty-term-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 24px;
            box-shadow: var(--shadow-card);
            text-align: left;
        }

        .empty-term-card h3 {
            font-size: var(--fs-title);
            font-weight: 650;
            letter-spacing: -0.3px;
            color: var(--text);
            margin-bottom: 8px;
        }

        .empty-term-card p {
            font-size: var(--fs-body);
            color: var(--text-2);
            line-height: 1.5;
            max-width: 40em;
        }

        .empty-term-card .resume {
            margin-top: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: var(--teal-wash);
            color: var(--teal);
            border-radius: 999px;
            font-size: var(--fs-small);
            font-weight: 600;
        }

        /* ── Settings ── */
        .settings-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(40, 40, 35, 0.35);
            display: none;
            align-items: flex-end;
            justify-content: center;
            padding: 0;
            box-sizing: border-box;
        }

        .settings-overlay.open { display: flex; }

        .settings-drawer {
            width: 100%;
            max-width: 100%;
            max-height: min(80vh, 640px);
            background: var(--surface-2);
            border-radius: 20px 20px 0 0;
            padding: 18px 18px calc(20px + env(safe-area-inset-bottom, 0px));
            border: 1px solid var(--border-strong);
            border-bottom: none;
            overflow-y: auto;
            box-shadow: var(--shadow-raised);
            /* Stay in normal flex flow — do not offset with top/right */
            position: relative;
            top: auto;
            right: auto;
            bottom: auto;
            left: auto;
            margin: 0;
            flex-shrink: 0;
        }

        .settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .settings-header h2 {
            font-size: var(--fs-title);
            font-weight: 650;
        }

        .settings-close {
            width: 36px;
            height: 36px;
            border: none;
            background: var(--bg);
            color: var(--text-2);
            border-radius: 10px;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
        }

        .settings-section { margin-bottom: 18px; }
        .settings-section h3 {
            font-size: var(--fs-label);
            font-weight: 650;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-3);
            margin-bottom: 10px;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            min-height: 44px;
        }

        .toggle-row input { display: none; }

        .toggle-slider {
            width: 44px;
            height: 26px;
            background: rgba(40, 40, 35, 0.12);
            border-radius: 999px;
            position: relative;
            flex-shrink: 0;
            transition: background 0.15s;
        }

        .toggle-slider:after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            box-shadow: 0 1px 3px rgba(40, 40, 35, 0.2);
            transition: transform 0.15s;
        }

        .toggle-row input:checked + .toggle-slider { background: var(--teal); }
        .toggle-row input:checked + .toggle-slider:after { transform: translateX(18px); }

        .toggle-label {
            font-size: var(--fs-body);
            font-weight: 500;
            color: var(--text);
        }

        .settings-hint {
            font-size: var(--fs-small);
            color: var(--text-3);
            line-height: 1.4;
            margin-top: 6px;
        }

        .kbd-hint {
            margin-top: 6px;
            font-size: var(--fs-small);
            color: var(--text-3);
        }

        .kbd-hint kbd {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--border-strong);
            background: var(--bg);
            font-size: var(--fs-label);
            font-family: inherit;
        }

        /* ── Tablet / laptop ── */
        @media (min-width: 760px) {
            :root {
                --fs-body: 21px;
                --fs-title: 28px;
                --fs-headline: clamp(28px, 3vw, 38px);
                --fs-class: 23px;
                --fs-grade: 30px;
                --fs-snap: 19px;
                --content-max: min(1680px, calc(100vw - 24px));
            }

            .masthead:has(.masthead-tonight) {
                display: grid;
                grid-template-columns: 1fr minmax(280px, 40%);
                column-gap: 24px;
                row-gap: 8px;
                align-items: start;
            }

            .masthead:has(.masthead-tonight) .masthead-kicker {
                grid-column: 1 / -1;
                margin-bottom: 0;
            }

            .masthead:has(.masthead-tonight) .masthead-headline {
                grid-column: 1;
            }

            .masthead:has(.masthead-tonight) .masthead-tonight {
                grid-column: 2;
                grid-row: 2 / span 4;
                margin-top: 0;
                align-self: stretch;
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 18px 20px;
            }

            .masthead:has(.masthead-tonight) .masthead-wins,
            .masthead:has(.masthead-tonight) .masthead-stats,
            .masthead:has(.masthead-tonight) .masthead-movers {
                grid-column: 1;
                margin-top: 6px;
            }
        }

        /* ── Desktop / car landscape: two class columns, bigger type ── */
        @media (min-width: 1100px) {
            :root {
                --fs-body: 22px;
                --fs-title: 30px;
                --fs-headline: clamp(30px, 2.6vw, 40px);
                --fs-class: 24px;
                --fs-grade: 32px;
                --fs-snap: 20px;
                --fs-meta: 17px;
                --content-max: min(1760px, calc(100vw - 32px));
                --row-pad-y: 18px;
                --row-pad-x: 20px;
                --touch-min: 60px;
            }

            .class-feed {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .class-row.expanded {
                grid-column: 1 / -1;
            }

            .row-trend .micro-spark {
                width: 56px;
                height: 20px;
            }

            .settings-overlay {
                align-items: center;
                justify-content: center;
                padding: 24px;
            }

            .settings-drawer {
                width: min(480px, calc(100vw - 48px));
                max-height: min(80vh, 640px);
                border-radius: 18px;
                border: 1px solid var(--border-strong);
                position: relative;
                top: auto;
                right: auto;
                bottom: auto;
                left: auto;
                margin: 0;
            }
        }

        @media (min-width: 1500px) {
            :root {
                --content-max: min(1840px, calc(100vw - 36px));
                --fs-headline: 40px;
            }
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-left">
            <div class="top-bar-title" id="topBarTitle">Grade Dashboard</div>
            <span class="last-updated" id="lastUpdated"></span>
        </div>
        <button class="settings-btn" id="settingsBtn" aria-label="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
            </svg>
        </button>
    </header>

    <div class="student-picker" id="studentPicker"></div>
    <button type="button" class="tonight-sticky" id="tonightSticky" hidden>
        <span class="tonight-sticky-label">Tonight</span>
        <span class="tonight-sticky-text" id="tonightStickyText"></span>
    </button>

    <div class="main-content">
        <div id="dashboards">
            <div class="loading-skeleton" id="loadingSkeleton">
                <div class="skel skel-hero"></div>
                <div class="skel skel-row"></div>
                <div class="skel skel-row"></div>
                <div class="skel skel-row"></div>
                <div class="skel skel-row"></div>
            </div>
        </div>
    </div>

    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-drawer" role="dialog" aria-label="Settings">
            <div class="settings-header">
                <h2>Settings</h2>
                <button class="settings-close" id="settingsClose" aria-label="Close">&times;</button>
            </div>
            <div class="settings-section">
                <h3>Shortcuts</h3>
                <p class="kbd-hint">
                    <kbd>1</kbd> / <kbd>2</kbd> switch student ·
                    <kbd>Esc</kbd> close settings
                </p>
                <p class="settings-hint">Type and layout scale up automatically on larger screens for desk and car use.</p>
            </div>
        </div>
    </div>

    <script>
        const TODAY = new Date();
        TODAY.setHours(0, 0, 0, 0);

        let currentData = null;
        let activeStudentIndex = 0;
        let studentFocusMap = {};

        async function loadData() {
            // file:// cannot fetch grades_data.json in Chrome/Safari — need a local server
            if (location.protocol === 'file:') {
                document.getElementById('dashboards').innerHTML = `
                    <div class="empty-state">
                        <strong>Open via a local server</strong>
                        <p style="max-width:28em;margin:0 auto;line-height:1.5">
                            Browsers block loading <code>grades_data.json</code> from a
                            <code>file://</code> link. In Terminal:
                        </p>
                        <pre style="text-align:left;display:inline-block;margin:14px auto 0;padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;font-size:12.5px;line-height:1.5;color:var(--text);box-shadow:var(--shadow-sm)">cd "/Users/davidcasas/My Dev Folder/aeries-dashboard"
python3 -m http.server 8765</pre>
                        <p style="margin-top:14px">Then open
                            <a href="http://localhost:8765/" style="color:var(--teal);font-weight:600">http://localhost:8765/</a>
                        </p>
                    </div>`;
                return null;
            }
            try {
                const resp = await fetch('grades_data.json');
                if (!resp.ok) throw new Error('No data');
                return await resp.json();
            } catch (e) {
                document.getElementById('dashboards').innerHTML = `
                    <div class="empty-state">
                        <strong>No grade data yet</strong>
                        <p>Could not load <code>grades_data.json</code>. Run a scrape, or check that the file sits next to this page.</p>
                    </div>`;
                return null;
            }
        }

        function parseDate(str) {
            if (!str) return null;
            const parts = str.split('/');
            if (parts.length !== 3) return null;
            return new Date(parts[2], parts[0] - 1, parts[1]);
        }

        function formatShortDate(date) {
            if (!date) return '';
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function formatDayOfWeek(date) {
            if (!date) return '';
            return date.toLocaleDateString('en-US', { weekday: 'short' });
        }

        function getWeekLabel(date) {
            const diff = Math.floor((date - TODAY) / (1000 * 60 * 60 * 24));
            if (diff < 0 && diff >= -7) return 'Last week';
            if (diff < -7 && diff >= -14) return '2 weeks ago';
            if (diff < -14) return 'Earlier';
            if (diff >= 0 && diff < 7) return 'This week';
            if (diff >= 7 && diff < 14) return 'Next week';
            if (diff >= 14 && diff < 21) return 'In 2 weeks';
            return 'Later';
        }

        function getDateClass(date) {
            const diff = Math.floor((date - TODAY) / (1000 * 60 * 60 * 24));
            if (diff < 0) return 'overdue';
            if (diff === 0) return 'today';
            if (diff <= 7) return 'this-week';
            return '';
        }

        function getScoreClass(pct) {
            if (pct === null || pct === undefined) return 'score-none';
            if (pct >= 80) return 'score-high';
            if (pct >= 60) return 'score-mid';
            return 'score-low';
        }

        function getGradeClass(pct) {
            if (!pct && pct !== 0) return 'grade-none';
            const n = parseFloat(pct);
            if (isNaN(n)) return 'grade-none';
            if (n >= 90) return 'grade-a';
            if (n >= 80) return 'grade-b';
            if (n >= 70) return 'grade-c';
            if (n >= 60) return 'grade-d';
            return 'grade-f';
        }

        function parseMissingCount(course) {
            if (course.missing_count > 0) return course.missing_count;
            const html = course.missing_assignments || '';
            const m = html.match(/>(\d+)</);
            return m ? parseInt(m[1], 10) : 0;
        }

        function isMissingAssignment(a) {
            const due = parseDate(a.due_date);
            if (!due || due >= TODAY) return false;
            return a.points_earned === null;
        }

        function normalizeAiClass(ai) {
            if (!ai) return null;
            const snap = (ai.snap || ai.urgency_reason || '').trim();
            const story = (ai.story || '').trim()
                || (ai.status || '').trim()
                || [ai.going_well, ai.going_wrong].filter(Boolean).join(' ').trim();
            const doTonight = (ai.do_tonight || ai.student_action || '').trim();
            return { ...ai, snap, story, do_tonight: doTonight };
        }

        function formatTrendDelta(delta) {
            if (delta == null || isNaN(delta)) return null;
            const n = Number(delta);
            const sign = n > 0 ? '+' : '';
            return `${sign}${n.toFixed(1)}`;
        }

        function pickTrendDelta(t) {
            if (!t) return { delta: null, window: '' };
            if (t.delta_7d != null && t.delta_7d !== 0) return { delta: t.delta_7d, window: '7d' };
            if (t.delta_14d != null && t.delta_14d !== 0) return { delta: t.delta_14d, window: '14d' };
            if (t.delta_span != null) return { delta: t.delta_span, window: t.span_window || 'term' };
            if (t.delta_7d != null) return { delta: t.delta_7d, window: '7d' };
            if (t.delta_14d != null) return { delta: t.delta_14d, window: '14d' };
            return { delta: null, window: '' };
        }

        function renderSparkline(points, width, height, strokeWidth) {
            if (!points || points.length < 2) return '';
            const w = width || 44;
            const h = height || 16;
            const sw = strokeWidth || 1.5;
            const pad = 1.5;
            const vals = points.map(p => Number(p.pct)).filter(v => !isNaN(v));
            if (vals.length < 2) return '';
            let min = Math.min(...vals);
            let max = Math.max(...vals);
            if (min === max) { min -= 1; max += 1; }
            const coords = vals.map((v, i) => {
                const x = pad + (i / (vals.length - 1)) * (w - pad * 2);
                const y = pad + (1 - (v - min) / (max - min)) * (h - pad * 2);
                return `${x.toFixed(1)},${y.toFixed(1)}`;
            });
            const last = vals[vals.length - 1];
            const first = vals[0];
            const stroke = last > first + 0.5 ? 'var(--teal)' : (last < first - 0.5 ? 'var(--red)' : 'var(--teal-mid)');
            const cls = w <= 48 ? 'micro-spark' : 'panel-spark';
            return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" preserveAspectRatio="none" aria-hidden="true">
                <polyline fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" points="${coords.join(' ')}" />
            </svg>`;
        }

        function findClassTrend(student, courseName) {
            const trends = student.class_trends || {};
            if (trends[courseName]) return trends[courseName];
            const cn = normalizeName(courseName);
            let best = null;
            let bestLen = 0;
            for (const [name, t] of Object.entries(trends)) {
                const an = normalizeName(name);
                if (!an) continue;
                if (cn.includes(an) || an.includes(cn)) {
                    if (an.length > bestLen) {
                        best = t;
                        bestLen = an.length;
                    }
                }
            }
            return best;
        }

        function extractPeriodFromLabel(label) {
            const m = label.match(/<<\s*(\d+)-/);
            if (m) return parseInt(m[1], 10);
            const m2 = label.match(/^(\d+)-/);
            return m2 ? parseInt(m2[1], 10) : null;
        }

        function normalizeName(str) {
            return (str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        function filterMissingAssignments(assignments) {
            return assignments
                .filter(isMissingAssignment)
                .sort((a, b) => {
                    const ptsDiff = (b.points_possible || 0) - (a.points_possible || 0);
                    if (ptsDiff !== 0) return ptsDiff;
                    return (parseDate(a.due_date) || 0) - (parseDate(b.due_date) || 0);
                });
        }

        function filterUpcomingAssignments(assignments) {
            return assignments
                .filter(a => {
                    const due = parseDate(a.due_date);
                    return due && due >= TODAY && a.points_earned == null;
                })
                .sort((a, b) => parseDate(a.due_date) - parseDate(b.due_date));
        }

        function filterRecentAssignments(assignments, limit) {
            return assignments
                .filter(a => {
                    const due = parseDate(a.due_date);
                    return due && due < TODAY && a.points_earned !== null;
                })
                .sort((a, b) => parseDate(b.due_date) - parseDate(a.due_date))
                .slice(0, limit || 8);
        }

        function buildClassProfiles(student) {
            const byPeriod = {};
            for (const ca of student.assignments_by_class || []) {
                const period = extractPeriodFromLabel(ca.class_name);
                if (period === null) continue;
                if (!byPeriod[period]) byPeriod[period] = [];
                const tagged = ca.assignments.map(a => ({ ...a, class_name: ca.class_name }));
                byPeriod[period].push(...tagged);
            }

            const profiles = [];
            for (const c of student.classes || []) {
                let assignments = byPeriod[c.period] || [];

                if (!assignments.length) {
                    const courseNorm = normalizeName(c.course_name);
                    for (const ca of student.assignments_by_class || []) {
                        const caPeriod = extractPeriodFromLabel(ca.class_name);
                        if (caPeriod === c.period) {
                            assignments = ca.assignments.map(a => ({ ...a, class_name: ca.class_name }));
                            break;
                        }
                        const labelNorm = normalizeName(ca.class_name);
                        if (courseNorm && labelNorm.includes(courseNorm)) {
                            assignments = ca.assignments.map(a => ({ ...a, class_name: ca.class_name }));
                            break;
                        }
                    }
                }

                // Include schedule-only rows (new term before grades post).
                // Still skip completely empty junk rows without a course name.
                if (!(c.course_name || '').trim() && !assignments.length) continue;

                const missing = filterMissingAssignments(assignments);
                const aeriesMissing = parseMissingCount(c);
                const missingCount = assignments.length ? missing.length : aeriesMissing;
                const upcoming = filterUpcomingAssignments(assignments);
                const recent = filterRecentAssignments(assignments, 8);

                profiles.push({
                    classMeta: c,
                    assignments,
                    missing,
                    upcoming,
                    recent,
                    missingCount,
                    period: c.period,
                });
            }
            return profiles;
        }

        function findAiClass(student, courseName) {
            const classes = student.ai_summary?.classes;
            if (!classes) return null;
            const cn = normalizeName(courseName);
            let best = null;
            let bestLen = 0;
            for (const cls of classes) {
                const an = normalizeName(cls.class_name);
                if (!an) continue;
                if (cn.includes(an) || an.includes(cn)) {
                    if (an.length > bestLen) {
                        best = cls;
                        bestLen = an.length;
                    }
                }
            }
            return best;
        }

        function urgencyToRank(urgency) {
            return { critical: 4, watch: 3, ok: 2, strong: 1 }[urgency] || 2;
        }

        function hasScoredAssignments(assignments) {
            return (assignments || []).some(a => a.points_earned != null);
        }

        function hasRealGrade(c, assignments) {
            const mark = (c.mark || '').trim();
            if (mark) return true;
            const raw = c.percent;
            if (raw === undefined || raw === null || String(raw).trim() === '') return false;
            const pct = parseFloat(raw);
            if (isNaN(pct)) return false;
            if (pct > 0) return true;
            // Phantom 0% at year start: only count if missing work or scored assignments exist
            if (parseMissingCount(c) > 0) return true;
            return hasScoredAssignments(assignments);
        }

        function inferUrgency(profile, aiClass) {
            if (aiClass?.urgency) return aiClass.urgency.toLowerCase();
            const mc = profile.missingCount;
            if (!hasRealGrade(profile.classMeta, profile.assignments)) {
                return mc > 0 ? 'watch' : 'ok';
            }
            const pct = parseFloat(profile.classMeta.percent);
            const belowB = !isNaN(pct) && pct < 80;
            const belowC = !isNaN(pct) && pct < 70;
            if (belowC || (belowB && mc > 0)) return 'critical';
            if (mc > 0 && !isNaN(pct) && pct >= 80) return 'watch';
            if (!isNaN(pct) && pct >= 90 && mc === 0) return 'strong';
            return 'ok';
        }

        function inferUrgencyReason(profile, urgency) {
            const mc = profile.missingCount;
            if (!hasRealGrade(profile.classMeta, profile.assignments)) {
                return mc > 0 ? `${mc} missing` : 'No grade yet';
            }
            const mark = profile.classMeta.mark || '';
            const pct = profile.classMeta.percent ? Math.round(parseFloat(profile.classMeta.percent)) + '%' : '';
            if (urgency === 'watch') {
                return `${mark} ${pct} · ${mc} missing`.trim();
            }
            if (urgency === 'critical') {
                return mc > 0 ? `At risk · ${mc} missing` : 'Needs improvement';
            }
            if (urgency === 'strong') return 'On track';
            return '';
        }

        function enrichProfiles(student, profiles) {
            return profiles.map(p => {
                const rawAi = findAiClass(student, p.classMeta.course_name);
                const aiClass = normalizeAiClass(rawAi);
                const urgency = inferUrgency(p, aiClass);
                const snap = (aiClass?.snap || inferUrgencyReason(p, urgency) || '').trim();
                return {
                    ...p,
                    aiClass,
                    urgency,
                    snap,
                    urgencyRank: urgencyToRank(urgency),
                };
            }).sort((a, b) => {
                if (b.urgencyRank !== a.urgencyRank) return b.urgencyRank - a.urgencyRank;
                return a.period - b.period;
            });
        }

        function formatGradeDisplay(c) {
            const mark = (c.mark || '').trim();
            const raw = c.percent;
            const hasPct = raw !== undefined && raw !== null && String(raw).trim() !== '';
            const pctNum = hasPct ? parseFloat(raw) : NaN;
            const pct = !isNaN(pctNum) ? Math.round(pctNum) : null;
            // Treat phantom 0% with no letter mark as "no grade yet"
            if (!mark && (pct === null || pct === 0) && !hasRealGrade(c)) {
                return { letter: '—', pct: '' };
            }
            if (mark && pct !== null) return { letter: mark, pct: pct + '%' };
            if (mark) return { letter: mark, pct: '' };
            if (pct !== null) return { letter: pct + '%', pct: '' };
            return { letter: '—', pct: '' };
        }

        function renderMovers(student) {
            const summary = (student.trend_summary || []).filter(t => t.delta != null && t.delta !== 0);
            if (!summary.length) return '';
            const items = summary.slice(0, 4).map(t => {
                const dir = t.direction || (t.delta > 0 ? 'up' : (t.delta < 0 ? 'down' : 'same'));
                const deltaStr = formatTrendDelta(t.delta);
                return `<span class="mover ${dir}">
                    <span class="name">${t.class_name || ''}</span>
                    <span class="delta">${deltaStr}</span>
                    <span class="win">${t.window || ''}</span>
                </span>`;
            }).join('');
            return `<div class="masthead-movers">
                <span class="movers-label">Trend</span>
                ${items}
            </div>`;
        }

        function renderAttendanceStats(student) {
            const a = student.attendance;
            if (!a || a.parse_failed) return '';
            const chips = [];
            const notStarted = !!(a.not_started || ((a.days_enrolled == null || a.days_enrolled === 0) && a.absences === 0 && a.tardies === 0));
            if (a.absences != null) {
                const cls = a.absences >= 5 ? 'alert' : (a.absences > 0 ? 'warn' : 'ok');
                chips.push(`<span class="masthead-stat ${cls}"><span class="stat-num">${a.absences}</span> absences</span>`);
            }
            if (a.tardies != null) {
                const cls = a.tardies >= 5 ? 'alert' : (a.tardies > 0 ? 'warn' : 'ok');
                chips.push(`<span class="masthead-stat ${cls}"><span class="stat-num">${a.tardies}</span> tardies</span>`);
            }
            if (a.unexcused != null && a.unexcused > 0) {
                chips.push(`<span class="masthead-stat alert"><span class="stat-num">${a.unexcused}</span> unexcused</span>`);
            }
            if (a.days_present != null && a.days_enrolled != null && a.days_enrolled > 0) {
                chips.push(`<span class="masthead-stat ok"><span class="stat-num">${a.days_present}</span> / ${a.days_enrolled} present</span>`);
            } else if (notStarted) {
                chips.push(`<span class="masthead-stat ok"><span class="stat-num stat-num-text">year not started</span></span>`);
            }
            if (a.year) {
                // Normalize 2025-2026 → “2025–26 school year”
                let yearLabel = String(a.year);
                const ym = yearLabel.match(/^(20\d{2})-20(\d{2})$/);
                if (ym) yearLabel = `${ym[1]}–${ym[2]} school year`;
                chips.push(`<span class="masthead-stat"><span class="stat-num stat-num-text">${yearLabel}</span></span>`);
            }
            if (!chips.length) return '';
            return `<div class="masthead-stats">${chips.join('')}</div>`;
        }

        function hasGradedClasses(student) {
            return (student.classes || []).some(c => hasRealGrade(c));
        }

        function hasScheduledClasses(student) {
            return (student.classes || []).some(c => (c.course_name || '').trim());
        }

        function hasPostedWork(student) {
            if (hasGradedClasses(student)) return true;
            if ((student.assignments_by_class || []).some(ca => (ca.assignments || []).length)) return true;
            const ai = student.ai_summary;
            if (ai && ((ai.focus_tonight || '').trim() || (ai.classes || []).length)) return true;
            return false;
        }

        function isSummerMode() {
            return !!(currentData && currentData.summer_break) || document.body.classList.contains('summer-break');
        }

        function isScheduleOnly(student) {
            return hasScheduledClasses(student) && !hasPostedWork(student);
        }

        function renderMasthead(student, idx) {
            const s = student.ai_summary;
            const scheduleOnly = isScheduleOnly(student);
            const emptyTerm = !hasScheduledClasses(student);
            const summer = isSummerMode() && emptyTerm;
            const focus = (!summer && !scheduleOnly && s) ? (s.focus_tonight || '').trim() : '';
            studentFocusMap[idx] = focus;
            const attendanceHtml = renderAttendanceStats(student);

            // True summer with no schedule: clear empty-state message
            if (summer || (emptyTerm && isSummerMode())) {
                const dateStr = (s && s.generated_at)
                    ? new Date(s.generated_at).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })
                    : '';
                let html = `<div class="masthead" id="hero-card-${idx}">`;
                html += `<div class="masthead-kicker"><h2>Briefing</h2>`;
                if (dateStr) html += `<span class="masthead-date">${dateStr}</span>`;
                html += `</div>`;
                html += `<div class="masthead-headline">School year is out — no current classes or missing work in the portal.</div>`;
                html += attendanceHtml;
                html += `</div>`;
                return html;
            }

            // Schedules posted, no real grades yet
            if (scheduleOnly) {
                const dateStr = (s && s.generated_at)
                    ? new Date(s.generated_at).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })
                    : '';
                const n = (student.classes || []).filter(c => (c.course_name || '').trim()).length;
                let headline = (s && s.headline) ? String(s.headline).trim() : '';
                if (!headline || /school year is out|no current classes or missing work/i.test(headline)) {
                    headline = `Schedules are up (${n} classes) — no grades posted yet.`;
                }
                let html = `<div class="masthead" id="hero-card-${idx}">`;
                html += `<div class="masthead-kicker"><h2>Briefing</h2>`;
                if (dateStr) html += `<span class="masthead-date">${dateStr}</span>`;
                html += `</div>`;
                html += `<div class="masthead-headline">${headline}</div>`;
                html += attendanceHtml;
                html += `</div>`;
                return html;
            }

            if (!s) {
                return `<div class="masthead" id="hero-card-${idx}">
                    <div class="masthead-kicker"><h2>Briefing</h2></div>
                    <div class="masthead-headline muted">No briefing yet</div>
                    ${attendanceHtml}
                    ${renderMovers(student)}
                </div>`;
            }

            const dateStr = s.generated_at
                ? new Date(s.generated_at).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })
                : '';
            let headline = (s.headline || s.status || '').trim();
            // Guard against old bad empty-term headlines once grades exist
            if (/no classes or missing work listed|mixed or stable performance/i.test(headline) && emptyTerm) {
                headline = 'School year is out — no current classes or missing work in the portal.';
            }

            let html = `<div class="masthead" id="hero-card-${idx}">`;
            html += `<div class="masthead-kicker"><h2>Briefing</h2>`;
            if (dateStr) html += `<span class="masthead-date">${dateStr}</span>`;
            html += `</div>`;
            if (headline) html += `<div class="masthead-headline">${headline}</div>`;

            if (focus) {
                html += `<div class="masthead-tonight" id="focus-card-${idx}">
                    <div class="label">Tonight</div>
                    <div class="text">${focus}</div>
                </div>`;
            }

            if (s.wins && s.wins.length) {
                html += `<div class="masthead-wins">`;
                s.wins.slice(0, 2).forEach(win => {
                    html += `<div class="win-line">${win}</div>`;
                });
                html += `</div>`;
            }

            // Legacy schemas
            if (!s.classes) {
                if (s.whats_happened && s.whats_happened.length) {
                    html += `<div class="masthead-wins" style="margin-top:10px">`;
                    s.whats_happened.slice(0, 3).forEach(item => {
                        const event = (typeof item === 'string') ? item : (item.event || '');
                        html += `<div class="win-line" style="color:var(--text-2)">${event}</div>`;
                    });
                    html += `</div>`;
                }
            }

            html += attendanceHtml;
            html += renderMovers(student);
            html += `</div>`;
            return html;
        }

        function formatSessionDay(iso) {
            if (!iso) return '';
            const d = new Date(`${iso}T12:00:00`);
            if (Number.isNaN(d.getTime())) return '';
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function renderEmptyTermCard() {
            const sess = (currentData && currentData.school_session) || {};
            const last = formatSessionDay(sess.last_day);
            const resume = formatSessionDay(sess.next_first_day) || formatSessionDay(sess.first_day);
            const lastLine = last
                ? `Tustin USD’s last day was ${last}. `
                : '';
            const resumeLine = resume
                ? `Grades resume after first day — ${resume}`
                : 'Grades resume on the first instructional day.';
            return `
                <div class="empty-term-card">
                    <h3>School year ended</h3>
                    <p>${lastLine}The parent portal isn’t listing current classes or missing work while school is out.</p>
                    <div class="resume">${resumeLine}</div>
                </div>`;
        }

        function dedupeStudentClasses(classes) {
            // Client-side safety net matching scraper: same period + course → keep richest row
            if (!Array.isArray(classes) || classes.length < 2) return classes || [];
            const best = new Map();
            const order = [];
            const richness = (c) => {
                let s = 0;
                const pct = String(c.percent ?? '').trim();
                const mark = String(c.mark ?? '').trim();
                if (pct) {
                    s += 2;
                    const n = parseFloat(pct);
                    if (!isNaN(n) && n > 0) s += 2;
                }
                if (mark) s += 3;
                if (c.missing_count) s += 1;
                if (String(c.missing_assignments || '').trim()) s += 1;
                if (String(c.trend || '').trim()) s += 1;
                return s;
            };
            for (const c of classes) {
                const key = `${c.period}::${String(c.course_name || '').trim().toLowerCase().replace(/\s+/g, ' ')}`;
                if (!best.has(key)) {
                    best.set(key, c);
                    order.push(key);
                } else if (richness(c) > richness(best.get(key))) {
                    best.set(key, c);
                }
            }
            return order.map(k => best.get(k));
        }

        function renderAssignmentList(assignments, kind) {
            if (!assignments.length) return '';
            let html = `<div class="list-panel">`;
            let currentWeek = '';

            for (const a of assignments) {
                const due = parseDate(a.due_date);
                if (kind !== 'missing') {
                    const week = getWeekLabel(due);
                    if (week !== currentWeek) {
                        currentWeek = week;
                        html += `<div class="week-label">${week}</div>`;
                    }
                }

                const dateClass = kind === 'missing' ? 'overdue' : getDateClass(due);
                const dateHtml = kind === 'missing'
                    ? formatShortDate(due)
                    : `${formatDayOfWeek(due)} ${formatShortDate(due)}`;

                let scoreHtml = '';
                if (kind === 'missing') {
                    scoreHtml = a.points_possible
                        ? `<span class="pts-badge">${a.points_possible} pts</span>`
                        : '';
                } else if (kind === 'upcoming') {
                    scoreHtml = a.points_earned !== null
                        ? `<div class="score ${getScoreClass(a.percentage)}">${a.points_earned}/${a.points_possible}</div>`
                        : `<span class="badge badge-upcoming">Due</span>`;
                } else {
                    scoreHtml = `<div class="score ${getScoreClass(a.percentage)}">${a.points_earned}/${a.points_possible}</div>
                        <div class="max">${a.percentage != null ? a.percentage.toFixed(0) + '%' : ''}</div>`;
                }

                html += `
                    <div class="assignment-row">
                        <div class="assignment-date ${dateClass}">${dateHtml}</div>
                        <div class="assignment-info">
                            <div class="title">${a.description}</div>
                            ${a.category ? `<div class="assignment-meta">${a.category}</div>` : ''}
                        </div>
                        <div class="assignment-score">${scoreHtml}</div>
                    </div>`;
            }
            return html + '</div>';
        }

        function renderClassPanel(profile, student) {
            const c = profile.classMeta;
            const ai = normalizeAiClass(profile.aiClass);
            const story = (ai?.story || '').trim();
            const doTonight = (ai?.do_tonight || '').trim();
            const snap = (profile.snap || '').trim();
            const storyText = story || snap;
            const g = formatGradeDisplay(c);
            const gradeClass = getGradeClass(c.percent);
            const gradeShow = [g.letter, g.pct && g.letter !== g.pct ? g.pct : ''].filter(Boolean).join(' ');

            const t = findClassTrend(student, c.course_name);
            const hist = t?.pct_history || [];
            const { delta, window } = pickTrendDelta(t);
            const deltaStr = formatTrendDelta(delta);
            const dir = delta == null || delta === 0 ? '' : (delta > 0 ? 'up' : 'down');
            const spark = renderSparkline(hist, 280, 36, 2);

            const teacher = (c.teacher || '').replace(/,\s*$/, '').trim();
            const room = (c.room || '').trim();
            const teacherLine = [teacher, room ? `Rm ${room}` : ''].filter(Boolean).join(' · ');

            // Stats row
            let stats = `<div class="panel-stats">
                <div class="stat-tile">
                    <div class="stat-label">Grade</div>
                    <div class="stat-value ${gradeClass}">${gradeShow || '—'}</div>
                </div>
                <div class="stat-tile">
                    <div class="stat-label">Change</div>
                    <div class="stat-value ${dir || ''}">${deltaStr != null ? deltaStr + (window ? ' · ' + window : '') : '—'}</div>
                </div>
                <div class="stat-tile">
                    <div class="stat-label">Missing</div>
                    <div class="stat-value ${profile.missingCount > 0 ? 'alert' : ''}">${profile.missingCount}</div>
                </div>
                <div class="stat-tile">
                    <div class="stat-label">Upcoming</div>
                    <div class="stat-value">${profile.upcoming.length}</div>
                </div>
            </div>`;

            let blocks = '';

            if (teacherLine) {
                blocks += `<div class="panel-meta-line">${teacherLine}</div>`;
            }

            if (doTonight) {
                blocks += `<div class="panel-block panel-block-tonight">
                    <div class="panel-block-label tonight">Tonight</div>
                    <div class="panel-tonight-text">${doTonight}</div>
                </div>`;
            }

            if (storyText) {
                blocks += `<div class="panel-block">
                    <div class="panel-block-label">Summary</div>
                    <div class="panel-story">${storyText}</div>
                </div>`;
            }

            if (spark || deltaStr != null) {
                let caption = '';
                if (deltaStr != null) {
                    caption = `<span class="delta ${dir}">${deltaStr} pts</span>`;
                    if (window) caption += ` over ${window}`;
                    if (hist.length >= 2) caption += ` · ${hist.length} scrapes`;
                } else if (hist.length >= 2) {
                    caption = `Grade over ${hist.length} scrapes`;
                }
                blocks += `<div class="panel-block">
                    <div class="panel-block-label">Trend</div>
                    <div class="panel-trend">
                        ${spark ? `<div class="panel-trend-chart">${spark}</div>` : ''}
                        ${caption ? `<div class="panel-trend-caption">${caption}</div>` : ''}
                    </div>
                </div>`;
            }

            // Assignment sections — always show structure when data exists
            const listBlocks = [];
            if (profile.missing.length) {
                listBlocks.push(`<div class="panel-block">
                    <div class="panel-block-label alert">Missing <span class="count">${profile.missing.length}</span></div>
                    ${renderAssignmentList(profile.missing, 'missing')}
                </div>`);
            }
            if (profile.upcoming.length) {
                listBlocks.push(`<div class="panel-block">
                    <div class="panel-block-label">Upcoming <span class="count">${profile.upcoming.length}</span></div>
                    ${renderAssignmentList(profile.upcoming, 'upcoming')}
                </div>`);
            }
            if (profile.recent.length) {
                listBlocks.push(`<div class="panel-block full">
                    <div class="panel-block-label">Recent scores <span class="count">${profile.recent.length}</span></div>
                    ${renderAssignmentList(profile.recent, 'recent')}
                </div>`);
            }

            if (listBlocks.length) {
                const twoCol = listBlocks.length >= 2 && (profile.missing.length || profile.upcoming.length);
                blocks += `<div class="panel-lists ${twoCol ? 'two-col' : ''}">${listBlocks.join('')}</div>`;
            }

            if (!doTonight && !storyText && !spark && !listBlocks.length) {
                blocks += `<div class="panel-block"><p class="panel-empty">No extra detail for this class yet.</p></div>`;
            }

            return `<div class="class-panel">${stats}${blocks}</div>`;
        }

        function renderClassFeed(profiles, idx, student) {
            if (!profiles.length) return '';

            const focusCount = profiles.filter(p => p.urgency === 'critical' || p.urgency === 'watch').length;
            const chevron = `<svg class="row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>`;

            const rows = profiles.map(p => {
                const c = p.classMeta;
                const g = formatGradeDisplay(c);
                const gradeClass = getGradeClass(c.percent);
                const urgency = p.urgency || 'ok';
                const snap = p.snap || '';
                const missingBadge = p.missingCount > 0
                    ? `<span class="row-missing">${p.missingCount}</span>`
                    : '';

                const t = findClassTrend(student, c.course_name);
                const hist = t?.pct_history || [];
                const micro = renderSparkline(hist, 44, 16, 1.5);
                const { delta } = pickTrendDelta(t);
                const deltaStr = formatTrendDelta(delta);
                const dir = delta == null || delta === 0 ? '' : (delta > 0 ? 'up' : 'down');

                const letterShow = g.pct && g.letter !== g.pct ? g.letter : g.letter;
                const pctShow = g.pct && g.letter !== g.pct ? g.pct : '';

                // Always start collapsed — no auto-expand
                return `
                    <div class="class-row urgency-${urgency}" id="class-${idx}-${p.period}">
                        <button type="button" class="class-row-btn" onclick="toggleClassCard(${idx}, ${p.period})" aria-expanded="false">
                            <span class="urgency-bar" aria-hidden="true"></span>
                            <div class="row-main">
                                <div class="row-title">
                                    <span class="row-period">P${p.period}</span>
                                    <span class="row-name">${c.course_name}</span>
                                    ${missingBadge}
                                </div>
                                ${snap ? `<div class="row-meta ${urgency === 'critical' || urgency === 'watch' ? urgency : ''}">${snap}</div>` : ''}
                            </div>
                            <div class="row-trail-wrap">
                                <div class="row-trail">
                                    <div class="row-grade">
                                        <span class="letter ${gradeClass}">${letterShow}</span>
                                        ${pctShow ? `<span class="pct">${pctShow}</span>` : ''}
                                    </div>
                                    <div class="row-trend">
                                        ${micro}
                                        ${deltaStr != null && delta !== 0 ? `<span class="row-delta ${dir}">${deltaStr}</span>` : ''}
                                    </div>
                                </div>
                                ${chevron}
                            </div>
                        </button>
                        <div class="class-row-detail">
                            ${renderClassPanel(p, student)}
                        </div>
                    </div>`;
            }).join('');

            return `
                <div class="feed-header">
                    <h2>Classes</h2>
                    <span class="count">${focusCount > 0 ? focusCount + ' need attention · ' : ''}${profiles.length}</span>
                </div>
                <div class="class-feed">${rows}</div>`;
        }

        function isDesktopLayout() {
            return window.matchMedia('(min-width: 1100px)').matches;
        }

        function toggleClassCard(studentIdx, period) {
            const row = document.getElementById(`class-${studentIdx}-${period}`);
            if (!row) return;
            const dashboard = document.getElementById(`dashboard-${studentIdx}`);
            const wasExpanded = row.classList.contains('expanded');
            const btn = row.querySelector('.class-row-btn');

            if (!isDesktopLayout()) {
                dashboard.querySelectorAll('.class-row.expanded').forEach(el => {
                    if (el !== row) {
                        el.classList.remove('expanded');
                        const b = el.querySelector('.class-row-btn');
                        if (b) b.setAttribute('aria-expanded', 'false');
                    }
                });
            }

            row.classList.toggle('expanded', !wasExpanded);
            if (btn) btn.setAttribute('aria-expanded', !wasExpanded ? 'true' : 'false');
        }

        function jumpToClass(studentIdx, period) {
            const row = document.getElementById(`class-${studentIdx}-${period}`);
            if (!row) return;

            if (!isDesktopLayout()) {
                const dashboard = document.getElementById(`dashboard-${studentIdx}`);
                dashboard.querySelectorAll('.class-row.expanded').forEach(el => {
                    el.classList.remove('expanded');
                    const b = el.querySelector('.class-row-btn');
                    if (b) b.setAttribute('aria-expanded', 'false');
                });
            }
            row.classList.add('expanded');
            const btn = row.querySelector('.class-row-btn');
            if (btn) btn.setAttribute('aria-expanded', 'true');

            const topBar = document.querySelector('.top-bar');
            const sticky = document.getElementById('tonightSticky');
            const stickyH = (sticky && sticky.classList.contains('visible')) ? sticky.offsetHeight : 0;
            const offset = (topBar ? topBar.offsetHeight : 0) + stickyH + 10;
            const y = row.getBoundingClientRect().top + window.scrollY - offset;
            window.scrollTo({ top: y, behavior: 'smooth' });
        }

        function renderStudent(student, idx) {
            // Dedupe phantom duplicate ClassSummary rows before building the feed
            student = { ...student, classes: dedupeStudentClasses(student.classes || []) };
            const profiles = enrichProfiles(student, buildClassProfiles(student));
            const noSchedule = !hasScheduledClasses(student) || profiles.length === 0;
            // True summer with nothing scheduled: empty-state card
            if (noSchedule && isSummerMode()) {
                return `
                    ${renderMasthead(student, idx)}
