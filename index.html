<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f1ea">
    <meta name="color-scheme" content="light">
    <title>Casas Family Grade Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            /* Light “Insights” theme — warm cream + teal */
            --bg: #f4f1ea;
            --surface: #faf8f4;
            --surface-2: #ffffff;
            --border: rgba(40, 40, 35, 0.08);
            --border-strong: rgba(40, 40, 35, 0.12);
            --text: #1c1c1a;
            --text-2: #5c5c56;
            /* Secondary colors are tuned to clear 4.5:1 on the cream surfaces */
            --text-3: #6d6d66;
            --teal: #1f5c52;
            --teal-mid: #2f7566;
            --teal-soft: #c8e6df;
            --teal-wash: rgba(31, 92, 82, 0.08);
            --green: #2a7a5c;
            --green-soft: rgba(42, 122, 92, 0.12);
            --amber: #8a6512;
            --amber-soft: rgba(166, 124, 26, 0.12);
            --red: #b04a2e;
            --red-soft: rgba(196, 92, 62, 0.12);
            --blue: #2f7566;
            --shadow-sm: 0 1px 2px rgba(40, 40, 35, 0.04);
            --shadow-card: 0 1px 2px rgba(40, 40, 35, 0.04), 0 8px 24px rgba(40, 40, 35, 0.05);
            --shadow-raised: 0 4px 20px rgba(40, 40, 35, 0.08);
            --touch-min: 56px;
            /* Fallback only — script measures the rendered header and overrides this */
            --top-bar-h: 74px;
            --radius: 16px;
            --radius-sm: 12px;
            --content-max: min(1680px, calc(100vw - 20px));
            --row-pad-y: 16px;
            --row-pad-x: 18px;
            --fs-body: 20px;
            --fs-title: 26px;
            --fs-headline: clamp(26px, 3.2vw, 36px);
            --fs-class: 22px;
            --fs-grade: 28px;
            --fs-snap: 18px;
            --fs-meta: 16px;
            --fs-small: 15px;
            --fs-label: 13px;
        }

        html {
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: var(--fs-body);
            line-height: 1.4;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        }

        /* ── Top bar ── */
        .top-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: var(--top-bar-h);
            padding: 8px 16px;
            padding-top: calc(8px + env(safe-area-inset-top, 0px));
            background: rgba(244, 241, 234, 0.9);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }

        .top-bar-left { flex: 1; min-width: 0; }

        .top-bar-title {
            font-size: var(--fs-title);
            font-weight: 650;
            letter-spacing: -0.3px;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .last-updated {
            display: block;
            font-size: var(--fs-small);
            color: var(--text-3);
            margin-top: 1px;
        }

        .last-updated.stale { color: var(--amber); font-weight: 600; }
        .last-updated.very-stale { color: var(--red); font-weight: 600; }

        .settings-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text-2);
            cursor: pointer;
            border-radius: var(--radius-sm);
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }

        .settings-btn:hover { color: var(--text); background: var(--surface); }
        .settings-btn svg { width: 18px; height: 18px; }

        /* ── Student switch ── */
        .student-picker {
            display: flex;
            gap: 0;
            background: var(--surface);
            border-radius: 999px;
            padding: 5px;
            margin: 8px auto 0;
            border: 1px solid var(--border);
            max-width: var(--content-max);
            width: var(--content-max);
            box-shadow: var(--shadow-sm);
        }

        .student-seg {
            flex: 1;
            min-height: var(--touch-min);
            border: none;
            background: none;
            color: var(--text-2);
            font-size: var(--fs-body);
            font-weight: 600;
            cursor: pointer;
            border-radius: 999px;
            transition: background 0.12s, color 0.12s, box-shadow 0.12s;
        }

        .student-seg:hover { color: var(--text); }
        .student-seg.active {
            background: var(--surface-2);
            color: var(--teal);
            box-shadow: var(--shadow-sm);
        }

        /* ── Sticky tonight ── */
        .tonight-sticky {
            position: sticky;
            top: var(--top-bar-h);
            z-index: 90;
            display: none;
            align-items: center;
            gap: 10px;
            margin: 0 auto;
            max-width: var(--content-max);
            width: var(--content-max);
            padding: 10px 16px;
            background: rgba(250, 248, 244, 0.95);
            border: 1px solid rgba(166, 124, 26, 0.22);
            border-top: none;
            border-radius: 0 0 var(--radius-sm) var(--radius-sm);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            text-align: left;
            color: inherit;
            font: inherit;
        }

        .tonight-sticky.visible { display: flex; }

        .tonight-sticky-label {
            font-size: var(--fs-label);
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--amber);
            flex-shrink: 0;
        }

        .tonight-sticky-text {
            font-size: var(--fs-meta);
            font-weight: 550;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── Main ── */
        .main-content {
            max-width: var(--content-max);
            width: var(--content-max);
            margin: 0 auto;
            padding: 10px 0 20px;
        }

        .dashboard { display: none; }
        .dashboard.active { display: block; }

        /* ── Masthead ── */
        .masthead {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px 16px;
            margin-bottom: 14px;
            box-shadow: var(--shadow-card);
        }

        .masthead-kicker {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 6px;
        }

        .masthead-kicker h2 {
            font-size: var(--fs-label);
            font-weight: 650;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-3);
        }

        .masthead-date {
            font-size: var(--fs-small);
            color: var(--text-3);
        }

        .masthead-headline {
            font-size: var(--fs-headline);
            font-weight: 650;
            line-height: 1.25;
            letter-spacing: -0.35px;
            color: var(--text);
            max-width: 32em;
        }

        .masthead-headline.muted {
            color: var(--text-2);
            font-weight: 500;
        }

        .masthead-tonight {
            margin-top: 12px;
            padding: 14px 16px;
            border-left: 4px solid var(--amber);
            background: var(--amber-soft);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        }

        .masthead-tonight .label {
            font-size: var(--fs-label);
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--amber);
            margin-bottom: 4px;
        }

        .masthead-tonight .text {
            font-size: calc(var(--fs-body) + 2px);
            font-weight: 600;
            line-height: 1.35;
            color: var(--text);
        }

        .tonight-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .tonight-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            min-height: 48px;
            padding: 6px 4px 6px 0;
            border: none;
            background: none;
            cursor: pointer;
            text-align: left;
            color: inherit;
            font: inherit;
            border-radius: 8px;
        }

        .tonight-item:hover .tonight-item-name { text-decoration: underline; }

        .tonight-item-main { min-width: 0; }

        .tonight-item-name {
            display: block;
            font-size: calc(var(--fs-body) + 2px);
            font-weight: 600;
            line-height: 1.3;
            color: var(--text);
        }

        .tonight-item-sub {
            display: block;
            font-size: var(--fs-small);
            color: var(--text-2);
            margin-top: 2px;
            line-height: 1.3;
        }

        .tonight-item-sub .status { font-weight: 650; }
        .tonight-item-sub .status.overdue { color: var(--red); }
        .tonight-item-sub .status.today { color: var(--amber); }
        .tonight-item-sub .status.tomorrow { color: var(--teal); }

        .tonight-item .row-chevron {
            margin-left: 0;
            transform: rotate(-90deg);
        }

        .masthead-wins {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .win-line {
            font-size: var(--fs-meta);
            color: var(--teal);
            line-height: 1.35;
            padding-left: 18px;
            position: relative;
        }

        .win-line::before {
            content: "✓";
            position: absolute;
            left: 0;
            font-weight: 700;
            font-size: var(--fs-label);
            top: 1px;
            color: var(--green);
        }

        .masthead-stats {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .masthead-stat {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            min-height: 44px;
            padding: 0 16px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 999px;
            box-shadow: var(--shadow-sm);
            font-size: var(--fs-small);
            line-height: 1;
            color: var(--text-2);
        }

        .masthead-stat .stat-num {
            font-size: 1.2em;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text);
            letter-spacing: -0.02em;
            line-height: 1;
        }

        .masthead-stat .stat-lbl {
            line-height: 1;
            font-weight: 500;
        }

        .masthead-stat-text {
            font-weight: 600;
            color: var(--text);
        }

        .masthead-stat.warn .stat-num { color: var(--amber); }
        .masthead-stat.alert .stat-num { color: var(--red); }
        .masthead-stat.ok .stat-num { color: var(--teal); }

        .masthead-movers {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            align-items: center;
        }

        .movers-label {
            font-size: var(--fs-label);
            font-weight: 650;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: var(--text-3);
            margin-right: 2px;
        }

        .mover {
            display: inline-flex;
            align-items: baseline;
            gap: 5px;
            font-size: var(--fs-small);
            color: var(--text-2);
            max-width: 100%;
        }

        .mover .name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 10em;
        }

        .mover .delta {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .mover.up .delta { color: var(--teal); }
        .mover.down .delta { color: var(--red); }
        .mover.same .delta { color: var(--text-3); }

        .mover .win {
            font-size: var(--fs-label);
            color: var(--text-3);
        }

        /* ── Feed ── */
        .feed-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
            padding: 0 2px;
        }

        .feed-header h2 {
            font-size: var(--fs-label);
            font-weight: 650;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-3);
        }

        .feed-header .count {
            font-size: var(--fs-small);
            color: var(--text-3);
            font-weight: 500;
        }

        .class-feed {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .class-row {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-card);
            transition: border-color 0.12s, box-shadow 0.12s;
        }

        .class-row.expanded {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-raised);
        }

        .class-row-btn {
            display: grid;
            grid-template-columns: 4px 1fr auto;
            gap: 0 14px;
            width: 100%;
            min-height: 88px;
            padding: var(--row-pad-y) var(--row-pad-x) var(--row-pad-y) 0;
            border: none;
            background: none;
            cursor: pointer;
            text-align: left;
            color: inherit;
            font: inherit;
            align-items: stretch;
        }

        .class-row-btn:hover { background: rgba(31, 92, 82, 0.03); }
        .class-row-btn:active { background: rgba(31, 92, 82, 0.05); }

        .class-row.expanded .class-row-btn {
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
        }

        .row-chevron {
            width: 24px;
            height: 24px;
            margin-left: 6px;
            color: var(--text-3);
            flex-shrink: 0;
            transition: transform 0.15s ease;
            align-self: center;
        }

        .class-row.expanded .row-chevron {
            transform: rotate(180deg);
            color: var(--text-2);
        }

        .row-trail-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .urgency-bar {
            width: 4px;
            border-radius: 0 2px 2px 0;
            background: transparent;
            align-self: stretch;
            min-height: 100%;
        }

        .urgency-critical .urgency-bar { background: var(--red); }
        .urgency-watch .urgency-bar { background: var(--amber); }
        .urgency-strong .urgency-bar { background: var(--teal); }
        .urgency-ok .urgency-bar { background: rgba(40, 40, 35, 0.12); }

        .row-main {
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 3px;
            padding: 2px 0;
        }

        .row-title {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 7px;
            min-width: 0;
        }

        .row-period {
            font-size: var(--fs-label);
            font-weight: 650;
            color: var(--text-3);
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        .row-name {
            font-size: var(--fs-class);
            font-weight: 650;
            color: var(--text);
            letter-spacing: -0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .row-missing,
        .row-awaiting {
            font-size: var(--fs-label);
            font-weight: 650;
            color: var(--red);
            background: var(--red-soft);
            padding: 3px 9px;
            border-radius: 999px;
            flex-shrink: 0;
            white-space: nowrap;
        }

        /* Awaiting score is quiet gray; it turns amber only when something has sat unscored for weeks. */
        .row-awaiting {
            color: var(--text-2);
            background: rgba(40, 40, 35, 0.07);
        }

        .row-awaiting.stale {
            color: var(--amber);
            background: var(--amber-soft);
        }

        .row-meta {
            font-size: var(--fs-snap);
            color: var(--text-2);
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .row-meta.critical { color: var(--red); }
        .row-meta.watch { color: var(--amber); }

        .row-trail {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
            flex-shrink: 0;
            min-width: 72px;
        }

        .row-grade {
            display: flex;
            align-items: baseline;
            gap: 5px;
            font-variant-numeric: tabular-nums;
        }

        .row-grade .letter {
            font-size: var(--fs-grade);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.3px;
        }

        .row-grade .pct {
            font-size: var(--fs-meta);
            font-weight: 550;
            color: var(--text-3);
        }

        .grade-a { color: var(--teal); }
        .grade-b { color: var(--green); }
        .grade-c { color: var(--amber); }
        .grade-d, .grade-f { color: var(--red); }
        .grade-none { color: var(--text-3); }

        .stat-tile .stat-value.grade-a { color: var(--teal); }
        .stat-tile .stat-value.grade-b { color: var(--green); }
        .stat-tile .stat-value.grade-c { color: var(--amber); }
        .stat-tile .stat-value.grade-d,
        .stat-tile .stat-value.grade-f { color: var(--red); }

        .row-trend {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .row-trend .micro-spark {
            display: block;
            width: 44px;
            height: 16px;
            flex-shrink: 0;
        }

        .row-delta {
            font-size: var(--fs-label);
            font-weight: 650;
            font-variant-numeric: tabular-nums;
            color: var(--text-3);
        }

        .row-delta.up { color: var(--teal); }
        .row-delta.down { color: var(--red); }

        /* ── Expanded class panel (self-contained) ── */
        .class-row-detail {
            display: none;
        }

        .class-row.expanded .class-row-detail {
            display: block;
            background: linear-gradient(180deg, rgba(244, 241, 234, 0.65), var(--bg));
            padding: 12px;
        }

        .class-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .panel-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        @media (max-width: 520px) {
            .panel-stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .stat-tile {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 12px 10px;
            min-width: 0;
            box-shadow: var(--shadow-sm);
        }

        .stat-tile .stat-label {
            font-size: var(--fs-label);
            font-weight: 650;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-3);
            margin-bottom: 4px;
        }

        .stat-tile .stat-value {
            font-size: var(--fs-grade);
            font-weight: 700;
            letter-spacing: -0.3px;
            font-variant-numeric: tabular-nums;
            color: var(--text);
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stat-tile .stat-value.sm {
            font-size: var(--fs-small);
            font-weight: 600;
        }

        .stat-tile .stat-value.up { color: var(--teal); }
        .stat-tile .stat-value.down { color: var(--red); }
        .stat-tile .stat-value.alert { color: var(--red); }
        .stat-tile .stat-value.quiet { color: var(--text-2); }
        .stat-tile .stat-value.stale { color: var(--amber); }

        .panel-block {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 14px 12px;
            box-shadow: var(--shadow-sm);
        }

        .panel-block-label {
            font-size: var(--fs-label);
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-3);
            margin-bottom: 8px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
        }

        .panel-block-label .count {
            font-weight: 650;
            letter-spacing: 0;
            text-transform: none;
            color: var(--text-3);
        }

        .panel-block-label.alert { color: var(--red); }
        .panel-block-label.alert .count { color: var(--red); }
        .panel-block-label.quiet { color: var(--text-2); }
        .panel-block-label.tonight { color: var(--amber); }

        .panel-block-label .label-note {
            margin-left: 8px;
            font-weight: 600;
            letter-spacing: 0;
            text-transform: none;
            color: var(--text-3);
        }

        .panel-block-label.alert .label-note { color: var(--red); }
        .panel-block-label .label-note.stale { color: var(--amber); }

        .panel-block-tonight {
            background: var(--amber-soft);
            border-color: rgba(166, 124, 26, 0.18);
        }

        .panel-story {
            font-size: var(--fs-meta);
            color: var(--text-2);
            line-height: 1.45;
            max-width: 60ch;
        }

        .panel-collapse {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            min-height: 48px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text-2);
            font: inherit;
            font-size: var(--fs-small);
            font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer;
        }

        .panel-collapse:hover { color: var(--text); }
        .panel-collapse .row-chevron { margin-left: 0; transform: rotate(180deg); }

        .panel-tonight-text {
            font-size: var(--fs-body);
            font-weight: 600;
            color: var(--text);
            line-height: 1.35;
        }

        .panel-meta-line {
            font-size: var(--fs-small);
            color: var(--text-3);
            line-height: 1.4;
            margin-top: 2px;
        }

        .panel-trend {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .panel-trend-chart {
            width: 100%;
            height: 48px;
            background: var(--teal-wash);
            border-radius: 10px;
            padding: 6px 8px;
        }

        .panel-trend-chart svg,
        .panel-spark {
            width: 100%;
            height: 36px;
            display: block;
        }

        .panel-trend-caption {
            font-size: var(--fs-small);
            color: var(--text-2);
            font-variant-numeric: tabular-nums;
        }

        .panel-trend-caption .delta.up { color: var(--teal); font-weight: 650; }
        .panel-trend-caption .delta.down { color: var(--red); font-weight: 650; }

        .panel-lists {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        @media (min-width: 640px) {
            .panel-lists.two-col {
                grid-template-columns: 1fr 1fr;
            }
            .panel-lists.two-col .panel-block.full {
                grid-column: 1 / -1;
            }
        }

        .panel-empty {
            font-size: var(--fs-small);
            color: var(--text-3);
            padding: 4px 0 2px;
        }

        /* ── Assignment rows ── */
        .list-panel { margin-top: 2px; }

        .week-label {
            font-size: var(--fs-label);
            font-weight: 600;
            color: var(--text-3);
            padding: 8px 0 4px;
        }

        .week-label:first-child { padding-top: 0; }

        .assignment-row {
            display: flex;
            align-items: flex-start;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            gap: 10px;
        }

        .assignment-row:last-child { border-bottom: none; }

        .assignment-date {
            font-size: var(--fs-label);
            font-weight: 650;
            color: var(--text-3);
            min-width: 52px;
            text-align: left;
            line-height: 1.25;
            flex-shrink: 0;
            padding-top: 2px;
            font-variant-numeric: tabular-nums;
        }

        .assignment-date.overdue { color: var(--red); }
        .assignment-date.today { color: var(--amber); }
        .assignment-date.this-week { color: var(--text-2); }

        .assignment-info { flex: 1; min-width: 0; }

        .assignment-info .title {
            font-size: var(--fs-meta);
            font-weight: 550;
            color: var(--text);
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .assignment-meta {
            font-size: var(--fs-label);
            color: var(--text-3);
            margin-top: 2px;
        }

        .assignment-score {
            text-align: right;
            min-width: 52px;
            flex-shrink: 0;
        }

        .assignment-score .score {
            font-size: var(--fs-meta);
            font-weight: 650;
            font-variant-numeric: tabular-nums;
        }

        .assignment-score .max {
            font-size: var(--fs-label);
            color: var(--text-3);
            margin-top: 1px;
        }

        .pts-badge {
            font-size: var(--fs-label);
            font-weight: 650;
            color: var(--text-2);
            background: var(--bg);
            padding: 2px 7px;
            border-radius: 8px;
            white-space: nowrap;
            border: 1px solid var(--border);
        }

        .pts-badge.muted { color: var(--text-3); }

        .badge {
            font-size: var(--fs-label);
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 8px;
            white-space: nowrap;
        }

        .badge-upcoming {
            background: var(--teal-wash);
            color: var(--teal);
        }

        .score-high { color: var(--teal); }
        .score-mid { color: var(--amber); }
        .score-low { color: var(--red); }
        .score-none { color: var(--text-3); font-weight: 400; }
        .score-code { color: var(--text); font-weight: 650; letter-spacing: 0.02em; }

        .assn-status {
            font-size: var(--fs-label);
            margin-top: 2px;
            color: var(--text-3);
        }
        .assn-status.counts { color: var(--teal); }
        .assn-status.pending { color: var(--text-2); }
        .assn-status.turned_in { color: var(--text-2); }
        .assn-status.missing { color: var(--red); }
        .assn-status.stale { color: var(--amber); font-weight: 600; }
        .assn-status.zero_weight { color: var(--text-3); }
        .assn-status.na,
        .assn-status.tx,
        .assn-status.ex,
        .assn-status.nt { color: var(--text-2); }
        .assn-status.extra_credit { color: var(--teal-mid); }

        .counted-insight {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .counted-note {
            font-size: var(--fs-small);
            color: var(--text-2);
            line-height: 1.4;
        }
        .cat-mix-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: var(--fs-small);
            line-height: 1.35;
            padding: 4px 0;
            border-bottom: 1px solid var(--border);
        }
        .cat-mix-row:last-child { border-bottom: none; }
        .cat-mix-row .cat-name { color: var(--text); font-weight: 550; }
        .cat-mix-row .cat-meta { color: var(--text-3); text-align: right; }
        .cat-mix-row.dropped .cat-name,
        .cat-mix-row.dropped .cat-meta { color: var(--text-3); }
        .cat-mix-row.counts .cat-meta { color: var(--teal); font-weight: 550; }
        .rebuild-debug {
            margin-top: 8px;
            font-size: var(--fs-label);
            color: var(--text-3);
        }
        .rebuild-debug summary {
            cursor: pointer;
            color: var(--text-3);
            font-weight: 550;
        }
        .rebuild-debug p { margin-top: 4px; line-height: 1.4; }

        .panel-block .assignment-row:first-of-type { padding-top: 0; }
        .panel-block .list-panel { margin-top: 0; }

        /* ── Empty / loading ── */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-3);
            font-size: var(--fs-body);
        }

        .empty-state strong {
            display: block;
            color: var(--text);
            margin-bottom: 6px;
            font-size: var(--fs-title);
        }

        .loading-skeleton { padding: 8px 0; }

        .skel {
            background: linear-gradient(90deg, #ebe7df 25%, #f7f4ee 50%, #ebe7df 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s ease-in-out infinite;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
        }

        .skel-hero { height: 140px; margin-bottom: 14px; }
        .skel-row { height: 88px; margin-bottom: 10px; border-radius: var(--radius); }

        @keyframes shimmer {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        .summer-break-banner {
            background: var(--amber-soft);
            border: 1px solid rgba(166, 124, 26, 0.22);
            padding: 12px 14px;
            margin: 12px auto 0;
            max-width: var(--content-max);
            width: var(--content-max);
            font-size: var(--fs-meta);
            color: var(--amber);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-sm);
        }

        /* Keep masthead + attendance visible; only hide tonight sticky in summer */
        body.summer-break .tonight-sticky {
            display: none !important;
        }

        .empty-term-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 24px;
            box-shadow: var(--shadow-card);
            text-align: left;
        }

        .empty-term-card h3 {
            font-size: var(--fs-title);
            font-weight: 650;
            letter-spacing: -0.3px;
            color: var(--text);
            margin-bottom: 8px;
        }

        .empty-term-card p {
            font-size: var(--fs-body);
            color: var(--text-2);
            line-height: 1.5;
            max-width: 40em;
        }

        .empty-term-card .resume {
            margin-top: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: var(--teal-wash);
            color: var(--teal);
            border-radius: 999px;
            font-size: var(--fs-small);
            font-weight: 600;
        }

        /* ── Settings ── */
        .settings-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(40, 40, 35, 0.35);
            display: none;
            align-items: flex-end;
            justify-content: center;
            padding: 0;
            box-sizing: border-box;
        }

        .settings-overlay.open { display: flex; }

        .settings-drawer {
            width: 100%;
            max-width: 100%;
            max-height: min(80vh, 640px);
            background: var(--surface-2);
            border-radius: 20px 20px 0 0;
            padding: 18px 18px calc(20px + env(safe-area-inset-bottom, 0px));
            border: 1px solid var(--border-strong);
            border-bottom: none;
            overflow-y: auto;
            box-shadow: var(--shadow-raised);
            /* Stay in normal flex flow — do not offset with top/right */
            position: relative;
            top: auto;
            right: auto;
            bottom: auto;
            left: auto;
            margin: 0;
            flex-shrink: 0;
        }

        .settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .settings-header h2 {
            font-size: var(--fs-title);
            font-weight: 650;
        }

        .settings-close {
            width: 44px;
            height: 44px;
            border: none;
            background: var(--bg);
            color: var(--text-2);
            border-radius: 10px;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
        }

        .settings-section { margin-bottom: 18px; }
        .settings-section h3 {
            font-size: var(--fs-label);
            font-weight: 650;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-3);
            margin-bottom: 10px;
        }

        .settings-hint {
            font-size: var(--fs-small);
            color: var(--text-3);
            line-height: 1.4;
            margin-top: 6px;
        }

        .kbd-hint {
            margin-top: 6px;
            font-size: var(--fs-small);
            color: var(--text-3);
        }

        .kbd-hint kbd {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--border-strong);
            background: var(--bg);
            font-size: var(--fs-label);
            font-family: inherit;
        }

        /* ── Focus ── */
        :focus-visible {
            outline: 3px solid var(--teal);
            outline-offset: 2px;
        }
        .class-row-btn:focus-visible {
            outline-offset: -3px;
            border-radius: var(--radius);
        }

        /* ── Tablet / laptop ── */
        @media (min-width: 760px) {
            :root {
                --fs-body: 21px;
                --fs-title: 28px;
                --fs-headline: clamp(28px, 3vw, 38px);
                --fs-class: 23px;
                --fs-grade: 30px;
                --fs-snap: 19px;
                --fs-meta: 17px;
                --fs-small: 16px;
                --fs-label: 14px;
                --content-max: min(1680px, calc(100vw - 24px));
            }

            .masthead:has(.masthead-tonight) {
                display: grid;
                grid-template-columns: 1fr minmax(280px, 40%);
                column-gap: 24px;
                row-gap: 8px;
                align-items: start;
            }

            .masthead:has(.masthead-tonight) .masthead-kicker {
                grid-column: 1 / -1;
                margin-bottom: 0;
            }

            .masthead:has(.masthead-tonight) .masthead-headline {
                grid-column: 1;
            }

            .masthead:has(.masthead-tonight) .masthead-tonight {
                grid-column: 2;
                grid-row: 2 / span 4;
                margin-top: 0;
                align-self: stretch;
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 18px 20px;
            }

            .masthead:has(.masthead-tonight) .masthead-wins,
            .masthead:has(.masthead-tonight) .masthead-stats,
            .masthead:has(.masthead-tonight) .masthead-movers {
                grid-column: 1;
                margin-top: 6px;
            }
        }

        /* ── Desktop / car landscape: bigger type, one period-order list ── */
        @media (min-width: 1100px) {
            :root {
                --fs-body: 22px;
                --fs-title: 30px;
                --fs-headline: clamp(30px, 2.6vw, 40px);
                --fs-class: 24px;
                --fs-grade: 32px;
                --fs-snap: 20px;
                --fs-meta: 18px;
                --fs-small: 17px;
                --fs-label: 15px;
                --content-max: min(1760px, calc(100vw - 32px));
                --row-pad-y: 18px;
                --row-pad-x: 20px;
                --touch-min: 60px;
            }

            .class-feed {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .row-trend .micro-spark {
                width: 56px;
                height: 20px;
            }

            .settings-overlay {
                align-items: center;
                justify-content: center;
                padding: 24px;
            }

            .settings-drawer {
                width: min(480px, calc(100vw - 48px));
                max-height: min(80vh, 640px);
                border-radius: 18px;
                border: 1px solid var(--border-strong);
                position: relative;
                top: auto;
                right: auto;
                bottom: auto;
                left: auto;
                margin: 0;
            }
        }

        @media (min-width: 1500px) {
            :root {
                --content-max: min(1840px, calc(100vw - 36px));
                --fs-headline: 40px;
            }
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-left">
            <div class="top-bar-title" id="topBarTitle">Grade Dashboard</div>
            <span class="last-updated" id="lastUpdated"></span>
        </div>
        <button class="settings-btn" id="settingsBtn" aria-label="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
            </svg>
        </button>
    </header>

    <div class="student-picker" id="studentPicker"></div>
    <button type="button" class="tonight-sticky" id="tonightSticky" hidden>
        <span class="tonight-sticky-label">Heads up</span>
        <span class="tonight-sticky-text" id="tonightStickyText"></span>
    </button>

    <div class="main-content">
        <div id="dashboards">
            <div class="loading-skeleton" id="loadingSkeleton">
                <div class="skel skel-hero"></div>
                <div class="skel skel-row"></div>
                <div class="skel skel-row"></div>
                <div class="skel skel-row"></div>
                <div class="skel skel-row"></div>
            </div>
        </div>
    </div>

    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-drawer" role="dialog" aria-modal="true" aria-label="Settings">
            <div class="settings-header">
                <h2>Settings</h2>
                <button class="settings-close" id="settingsClose" aria-label="Close">&times;</button>
            </div>
            <div class="settings-section">
                <h3>Shortcuts</h3>
                <p class="kbd-hint">
                    <kbd>1</kbd> / <kbd>2</kbd> switch student ·
                    <kbd>Esc</kbd> close settings
                </p>
                <p class="settings-hint">Type and layout scale up automatically on larger screens for desk and car use.</p>
            </div>
        </div>
    </div>

    <script>
        const REFRESH_MS = 30 * 60 * 1000;
        let refreshTimer = null;
        let listenersBound = false;

        function esc(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function pacificToday() {
            const parts = new Date().toLocaleDateString('en-US', {
                timeZone: 'America/Los_Angeles',
                year: 'numeric',
                month: 'numeric',
                day: 'numeric',
            }).split('/');
            return new Date(Number(parts[2]), Number(parts[0]) - 1, Number(parts[1]));
        }

        const TODAY = pacificToday();

        let currentData = null;
        let activeStudentIndex = 0;
        let studentFocusMap = {};
        let studentTonightMap = {};
        let lastPaintedStamp = null;

        async function loadData() {
            // file:// cannot fetch grades_data.json in Chrome/Safari — need a local server
            if (location.protocol === 'file:') {
                document.getElementById('dashboards').innerHTML = `
                    <div class="empty-state">
                        <strong>Open via a local server</strong>
                        <p style="max-width:28em;margin:0 auto;line-height:1.5">
                            Browsers block loading <code>grades_data.json</code> from a
                            <code>file://</code> link. In Terminal:
                        </p>
                        <pre style="text-align:left;display:inline-block;margin:14px auto 0;padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;font-size:12.5px;line-height:1.5;color:var(--text);box-shadow:var(--shadow-sm)">python3 -m http.server 8765</pre>
                        <p style="margin-top:14px">Then open
                            <a href="http://localhost:8765/" style="color:var(--teal);font-weight:600">http://localhost:8765/</a>
                        </p>
                    </div>`;
                return null;
            }
            try {
                const resp = await fetch('grades_data.json?t=' + Date.now(), { cache: 'no-store' });
                if (!resp.ok) throw new Error('No data');
                return await resp.json();
            } catch (e) {
                document.getElementById('dashboards').innerHTML = `
                    <div class="empty-state">
                        <strong>Grades didn’t load</strong>
                        <p>Try again in a few minutes. If it keeps happening, check that <code>grades_data.json</code> sits next to this page.</p>
                    </div>`;
                return null;
            }
        }

        function parseDate(str) {
            if (!str) return null;
            const parts = str.split('/');
            if (parts.length !== 3) return null;
            return new Date(parts[2], parts[0] - 1, parts[1]);
        }

        function formatShortDate(date) {
            if (!date) return '';
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function formatDayOfWeek(date) {
            if (!date) return '';
            return date.toLocaleDateString('en-US', { weekday: 'short' });
        }

        function daysFromToday(date) {
            if (!date) return null;
            const a = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
            const b = Date.UTC(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate());
            return Math.round((a - b) / 86400000);
        }

        const WEEK_BUCKET_ORDER = [
            'Earlier', '2 weeks ago', 'Last week', 'This week', 'Next week', 'In 2 weeks', 'Later',
        ];

        function getWeekLabel(date) {
            if (!date) return 'Later';
            const diff = daysFromToday(date);
            if (diff == null || isNaN(diff)) return 'Later';
            if (diff < 0 && diff >= -7) return 'Last week';
            if (diff < -7 && diff >= -14) return '2 weeks ago';
            if (diff < -14) return 'Earlier';
            if (diff >= 0 && diff < 7) return 'This week';
            if (diff >= 7 && diff < 14) return 'Next week';
            if (diff >= 14 && diff < 21) return 'In 2 weeks';
            return 'Later';
        }

        function getDateClass(date) {
            const diff = daysFromToday(date);
            if (diff == null || isNaN(diff)) return '';
            if (diff < 0) return 'overdue';
            if (diff === 0) return 'today';
            if (diff <= 7) return 'this-week';
            return '';
        }

        function getScoreClass(pct) {
            if (pct === null || pct === undefined) return 'score-none';
            if (pct >= 80) return 'score-high';
            if (pct >= 60) return 'score-mid';
            return 'score-low';
        }

        function getGradeClass(pct) {
            if (!pct && pct !== 0) return 'grade-none';
            const n = parseFloat(pct);
            if (isNaN(n)) return 'grade-none';
            if (n >= 90) return 'grade-a';
            if (n >= 80) return 'grade-b';
            if (n >= 70) return 'grade-c';
            if (n >= 60) return 'grade-d';
            return 'grade-f';
        }

        function parseMissingCount(course) {
            if (course.missing_count > 0) return course.missing_count;
            const html = course.missing_assignments || '';
            const m = html.match(/>(\d+)</);
            return m ? parseInt(m[1], 10) : 0;
        }

        function scoreStatusCode(a) {
            const raw = String((a && a.score_raw) || '').trim();
            const m = raw.match(/\b(NA|TX|EX|NT)\b/i);
            return m ? m[1].toUpperCase() : '';
        }

        function assignmentHasScoreMark(a) {
            if (!a) return false;
            if (a.points_earned != null) return true;
            return !!scoreStatusCode(a);
        }

        function isPastDueUngraded(a) {
            const due = parseDate(a.due_date);
            if (!due || due >= TODAY) return false;
            if (assignmentHasScoreMark(a)) return false;
            return a.points_earned === null;
        }

        // Aeries stamps Date Completed when work was handed in — usually in class.
        function isTurnedIn(a) {
            return !!(a && String(a.date_completed || '').trim()) || !!(a && a.turned_in);
        }

        function isDueInDaysUngraded(a, days) {
            const due = parseDate(a.due_date);
            if (!due || assignmentHasScoreMark(a) || isTurnedIn(a)) return false;
            return daysFromToday(due) === days;
        }

        function isDueTodayUngraded(a) {
            return isDueInDaysUngraded(a, 0);
        }

        function normalizeAiClass(ai) {
            if (!ai) return null;
            const snap = (ai.snap || ai.urgency_reason || '').trim();
            const story = (ai.story || '').trim()
                || (ai.status || '').trim()
                || [ai.going_well, ai.going_wrong].filter(Boolean).join(' ').trim();
            const doTonight = (ai.do_tonight || ai.student_action || '').trim();
            return { ...ai, snap, story, do_tonight: doTonight };
        }

        function formatTrendDelta(delta) {
            if (delta == null || isNaN(delta)) return null;
            const n = Number(delta);
            const sign = n > 0 ? '+' : '';
            return `${sign}${n.toFixed(1)}`;
        }

        function historyWithoutLeadingPhantom(points) {
            const list = points || [];
            let i = 0;
            while (i < list.length && (list[i].pct == null || Number(list[i].pct) === 0)) i++;
            return list.slice(i);
        }

        function isFirstPostedGradeDelta(t, delta) {
            if (delta == null || Number(delta) === 0) return false;
            const hist = (t && t.pct_history) || [];
            if (hist.length < 2) return false;
            const firstReal = hist.find(p => p.pct != null && Number(p.pct) !== 0);
            if (!firstReal) return false;
            const leadingPhantom = hist.some(p => p.pct != null && Number(p.pct) === 0);
            if (!leadingPhantom) return false;
            const last = hist[hist.length - 1];
            const lastPct = last && last.pct != null ? Number(last.pct) : null;
            return Math.abs(Number(delta) - Number(firstReal.pct)) < 0.2
                || (lastPct != null && Math.abs(Number(delta) - lastPct) < 0.2);
        }

        function pickTrendDelta(t) {
            if (!t) return { delta: null, window: '' };
            const candidates = [
                [t.delta_7d, '7d'],
                [t.delta_14d, '14d'],
                [t.delta_span, t.span_window || 'term'],
            ];
            for (const [delta, window] of candidates) {
                if (delta == null || delta === 0) continue;
                if (isFirstPostedGradeDelta(t, delta)) continue;
                return { delta, window };
            }
            return { delta: null, window: '' };
        }

        function renderSparkline(points, width, height, strokeWidth) {
            points = historyWithoutLeadingPhantom(points);
            if (!points || points.length < 2) return '';
            const w = width || 44;
            const h = height || 16;
            const sw = strokeWidth || 1.5;
            const pad = 1.5;
            const vals = points.map(p => Number(p.pct)).filter(v => !isNaN(v));
            if (vals.length < 2) return '';
            let min = Math.min(...vals);
            let max = Math.max(...vals);
            if (min === max) { min -= 1; max += 1; }
            const coords = vals.map((v, i) => {
                const x = pad + (i / (vals.length - 1)) * (w - pad * 2);
                const y = pad + (1 - (v - min) / (max - min)) * (h - pad * 2);
                return `${x.toFixed(1)},${y.toFixed(1)}`;
            });
            const last = vals[vals.length - 1];
            const first = vals[0];
            const stroke = last > first + 0.5 ? 'var(--teal)' : (last < first - 0.5 ? 'var(--red)' : 'var(--teal-mid)');
            const cls = w <= 48 ? 'micro-spark' : 'panel-spark';
            return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" preserveAspectRatio="none" aria-hidden="true">
                <polyline fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" points="${coords.join(' ')}" />
            </svg>`;
        }

        function findClassTrend(student, courseName) {
            const trends = student.class_trends || {};
            if (trends[courseName]) return trends[courseName];
            const cn = normalizeName(courseName);
            let best = null;
            let bestLen = 0;
            for (const [name, t] of Object.entries(trends)) {
                const an = normalizeName(name);
                if (!an) continue;
                if (cn.includes(an) || an.includes(cn)) {
                    if (an.length > bestLen) {
                        best = t;
                        bestLen = an.length;
                    }
                }
            }
            return best;
        }

        function extractPeriodFromLabel(label) {
            const m = label.match(/<<\s*(\d+)-/);
            if (m) return parseInt(m[1], 10);
            const m2 = label.match(/^(\d+)-/);
            return m2 ? parseInt(m2[1], 10) : null;
        }

        function normalizeName(str) {
            return (str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        // Missing is only a gradebook-row flag (MI / MissingAssignment). The ClassSummary
        // widget count often includes unscored past-due work the teacher has not marked missing.
        function isAeriesFlaggedMissing(a) {
            return !!(a && a.aeries_missing && a.points_earned == null);
        }

        function filterMissingAssignments(assignments) {
            const byDue = (a, b) => (parseDate(a.due_date) || 0) - (parseDate(b.due_date) || 0);
            return (assignments || []).filter(isAeriesFlaggedMissing).sort(byDue);
        }

        // Past-due, unscored, and not flagged by Aeries: the teacher just hasn't posted a score yet.
        function filterAwaitingAssignments(assignments, missing) {
            const missingSet = new Set(missing || []);
            return (assignments || [])
                .filter(a => isPastDueUngraded(a) && !missingSet.has(a))
                .sort((a, b) => (parseDate(a.due_date) || 0) - (parseDate(b.due_date) || 0));
        }

        const STALE_AWAITING_DAYS = 10;

        function daysPastDue(a) {
            const due = parseDate(a && a.due_date);
            if (!due) return null;
            const d = -daysFromToday(due);
            return d > 0 ? d : 0;
        }

        // Unscored this long past due is worth a question to the teacher, but it is still not "missing".
        function isStaleAwaiting(a) {
            if (!isPastDueUngraded(a)) return false;
            const d = daysPastDue(a);
            return d != null && d >= STALE_AWAITING_DAYS;
        }

        function filterUpcomingAssignments(assignments) {
            return assignments
                .filter(a => {
                    const due = parseDate(a.due_date);
                    return due && due >= TODAY && !assignmentHasScoreMark(a);
                })
                .sort((a, b) => parseDate(a.due_date) - parseDate(b.due_date));
        }

        function filterScoredAssignments(assignments) {
            return assignments
                .filter(a => assignmentHasScoreMark(a))
                .sort((a, b) => (parseDate(b.due_date) || 0) - (parseDate(a.due_date) || 0));
        }

        function inferAssignmentStatus(a, insight) {
            const code = scoreStatusCode(a);
            if (code) return { status: code.toLowerCase(), label: code };
            // Blank score: decide here rather than trusting an older payload's "counts" label.
            if (a.points_earned == null) {
                if (isAeriesFlaggedMissing(a)) return { status: 'missing', label: 'marked missing in Aeries' };
                if (isStaleAwaiting(a)) {
                    const d = daysPastDue(a);
                    const age = `awaiting score ${d} days · worth asking`;
                    return { status: 'stale', label: isTurnedIn(a) ? `turned in · ${age}` : age };
                }
                if (isTurnedIn(a)) return { status: 'turned_in', label: 'turned in · awaiting score' };
                if (isPastDueUngraded(a)) return { status: 'pending', label: 'awaiting score' };
                return { status: 'pending', label: '' };
            }
            if (a.status && a.status_label) {
                return { status: a.status, label: a.status_label };
            }
            const cat = (a.category || '').trim();
            const mix = (insight && insight.categories) || [];
            const hit = mix.find(c => {
                const an = normalizeName(c.name);
                const bn = normalizeName(cat);
                return an && bn && (an === bn || an.includes(bn) || bn.includes(an));
            });
            if (hit && hit.weight_pct === 0) {
                return { status: 'zero_weight', label: '0% category (doesn\'t count)' };
            }
            if (a.extra_credit || (a.points_possible === 0 && a.points_earned != null)) {
                return { status: 'extra_credit', label: cat ? `extra credit in ${cat}` : 'extra credit' };
            }
            if (cat) return { status: 'counts', label: `counts in ${cat}` };
            return { status: 'counts', label: 'counts' };
        }

        function assignmentScoreDisplay(a) {
            const raw = String(a.score_raw || '').trim();
            const code = scoreStatusCode(a);
            if (code) {
                return { text: raw || code, cls: 'score-code', pct: '' };
            }
            if (a.points_earned != null) {
                const max = a.points_possible == null ? '' : a.points_possible;
                return {
                    text: `${a.points_earned}/${max}`,
                    cls: getScoreClass(a.percentage),
                    pct: a.percentage != null ? a.percentage.toFixed(0) + '%' : '',
                };
            }
            if (raw && !/^\d+(\.\d+)?$/.test(raw)) {
                return { text: raw, cls: 'score-none', pct: '' };
            }
            return { text: '—', cls: 'score-none', pct: '' };
        }

        function buildClassProfiles(student) {
            const byPeriod = {};
            for (const ca of student.assignments_by_class || []) {
                const period = extractPeriodFromLabel(ca.class_name);
                if (period === null) continue;
                if (!byPeriod[period]) byPeriod[period] = [];
                const tagged = ca.assignments.map(a => ({ ...a, class_name: ca.class_name }));
                byPeriod[period].push(...tagged);
            }

            const profiles = [];
            for (const c of student.classes || []) {
                let assignments = byPeriod[c.period] || [];

                if (!assignments.length) {
                    const courseNorm = normalizeName(c.course_name);
                    for (const ca of student.assignments_by_class || []) {
                        const caPeriod = extractPeriodFromLabel(ca.class_name);
                        if (caPeriod === c.period) {
                            assignments = ca.assignments.map(a => ({ ...a, class_name: ca.class_name }));
                            break;
                        }
                        const labelNorm = normalizeName(ca.class_name);
                        if (courseNorm && labelNorm.includes(courseNorm)) {
                            assignments = ca.assignments.map(a => ({ ...a, class_name: ca.class_name }));
                            break;
                        }
                    }
                }

                // Include schedule-only rows (new term before grades post).
                // Still skip completely empty junk rows without a course name.
                if (!(c.course_name || '').trim() && !assignments.length) continue;

                const missing = filterMissingAssignments(assignments);
                const missingCount = missing.length;
                const awaiting = filterAwaitingAssignments(assignments, missing);
                const upcoming = filterUpcomingAssignments(assignments);
                const recent = filterScoredAssignments(assignments);

                // Prefer ClassSummary copies; fall back to the GradebookDetails group
                if (!c.counted_insight || !c.gradebook_totals) {
                    const group = (student.assignments_by_class || []).find(ca => {
                        const samePeriod = ca.period != null && ca.period === c.period;
                        const cn = normalizeName(c.course_name);
                        const gn = normalizeName(ca.class_name);
                        const nameHit = cn && gn && (cn.includes(gn) || gn.includes(cn));
                        return samePeriod || nameHit;
                    });
                    if (group) {
                        if (!c.gradebook_totals && group.totals) c.gradebook_totals = group.totals;
                        if (!c.counted_insight && group.counted_insight) c.counted_insight = group.counted_insight;
                    }
                }

                profiles.push({
                    classMeta: c,
                    assignments,
                    missing,
                    awaiting,
                    upcoming,
                    recent,
                    missingCount,
                    awaitingCount: awaiting.length,
                    staleAwaitingCount: awaiting.filter(isStaleAwaiting).length,
                    newlyMissing: [],
                    period: c.period,
                });
            }
            return profiles;
        }

        function findAiClass(student, courseName) {
            const classes = student.ai_summary?.classes;
            if (!classes) return null;
            const cn = normalizeName(courseName);
            let best = null;
            let bestLen = 0;
            for (const cls of classes) {
                const an = normalizeName(cls.class_name);
                if (!an) continue;
                if (cn.includes(an) || an.includes(cn)) {
                    if (an.length > bestLen) {
                        best = cls;
                        bestLen = an.length;
                    }
                }
            }
            return best;
        }

        function formatClassesCount(focusCount, total) {
            const parts = [];
            if (focusCount > 0) {
                parts.push(focusCount === 1 ? '1 needs attention' : `${focusCount} need attention`);
            }
            parts.push(total === 1 ? '1 class' : `${total} classes`);
            return parts.join(' · ');
        }

        function urgencyToRank(urgency) {
            return { critical: 4, watch: 3, ok: 2, strong: 1 }[urgency] || 2;
        }

        function hasScoredAssignments(assignments) {
            return (assignments || []).some(a => a.points_earned != null);
        }

        function hasRealGrade(c, assignments) {
            const mark = (c.mark || '').trim();
            if (mark) return true;
            const raw = c.percent;
            if (raw === undefined || raw === null || String(raw).trim() === '') return false;
            const pct = parseFloat(raw);
            if (isNaN(pct)) return false;
            if (pct > 0) return true;
            // 0% + empty mark is a placeholder. Scored assignments do not make it a class grade.
            if (parseMissingCount(c) > 0) return true;
            return false;
        }

        function isPhantomZero(c, assignments) {
            if (c && c.phantom_zero) return true;
            const mark = (c && c.mark || '').trim();
            const pct = parseFloat(c && c.percent);
            return !mark && !isNaN(pct) && pct === 0 && !hasRealGrade(c, assignments);
        }

        function assignmentsForClassMeta(student, c) {
            for (const ca of (student && student.assignments_by_class) || []) {
                if (ca.period != null && c && ca.period === c.period) return ca.assignments || [];
                const cn = normalizeName(c && c.course_name);
                const gn = normalizeName(ca.class_name);
                if (cn && gn && (cn.includes(gn) || gn.includes(cn))) return ca.assignments || [];
            }
            return [];
        }

        function formatScorePair(earned, possible) {
            const fmt = n => (typeof n === 'number' && Number.isInteger(n)) || (typeof n === 'number' && n % 1 === 0)
                ? String(Math.round(n))
                : String(n);
            return `${fmt(earned)}/${fmt(possible)}`;
        }

        function formatDueLabel(a, opts) {
            // Past-due blanks are where the missing rule changed; recompute rather than trust a stored label.
            if (a && a.due_label && !isPastDueUngraded(a)) return a.due_label;
            const due = parseDate(a && a.due_date);
            if (!due) return '';
            const datePart = formatShortDate(due);
            const weekdayDate = `${formatDayOfWeek(due)} ${datePart}`;
            const scored = assignmentHasScoreMark(a);
            const days = daysFromToday(due);
            const isMissing = !!(opts && opts.isMissing);
            if (scored && days < 0) {
                if (a.points_earned != null && a.points_possible != null) {
                    return formatScorePair(a.points_earned, a.points_possible);
                }
                if (a.percentage != null) return `${Number(a.percentage)}%`;
                return `completed ${datePart}`;
            }
            if (days === 0 && !scored) return 'due today';
            if (days > 0) return `due ${weekdayDate}`;
            if (isMissing) return `overdue ${datePart}`;
            if (isTurnedIn(a)) return `turned in · awaiting score`;
            return `awaiting score · was due ${weekdayDate}`;
        }

        function escapeRegExp(s) {
            return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function rewriteStaleDueCopy(text, profile) {
            if (!text) return text;
            let out = String(text);
            const weekdays = 'Mon|Tue|Wed|Thu|Fri|Sat|Sun|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday';
            const dueWeekday = new RegExp(`\\bdue\\s+(${weekdays})\\b(?!\\s+[A-Za-z]{3}\\s+\\d)`, 'gi');
            const missingNames = new Set((profile.missing || []).map(a => a.description));
            const assignments = [...(profile.assignments || [])]
                .filter(a => a && a.description)
                .sort((a, b) => (b.description || '').length - (a.description || '').length);
            for (const a of assignments) {
                const name = a.description;
                if (out.indexOf(name) === -1) continue;
                const label = formatDueLabel(a, { isMissing: missingNames.has(name) });
                const due = parseDate(a.due_date);
                const days = due ? daysFromToday(due) : null;
                const namedWeekday = new RegExp(
                    `${escapeRegExp(name)}(\\s*[·\\-–—:]\\s*)due\\s+(?:${weekdays})\\b(?!\\s+[A-Za-z]{3}\\s+\\d)`,
                    'gi'
                );
                if (namedWeekday.test(out)) {
                    namedWeekday.lastIndex = 0;
                    out = out.replace(namedWeekday, (_, sep) => name + sep + label);
                    continue;
                }
                // Older briefings may call this "overdue" even though Aeries does not flag it missing.
                if (!missingNames.has(name)) {
                    const namedOverdue = new RegExp(
                        `${escapeRegExp(name)}(\\s*[·\\-–—:]\\s*)overdue\\b[^\\n·]*`,
                        'i'
                    );
                    if (namedOverdue.test(out)) {
                        out = out.replace(namedOverdue, (_, sep) => name + sep + label);
                        continue;
                    }
                }
                if (days != null && days < 0) {
                    const namedDue = new RegExp(
                        `${escapeRegExp(name)}(\\s*[·\\-–—:]\\s*)due\\s+[^\\n·]+`,
                        'i'
                    );
                    if (namedDue.test(out)) {
                        out = out.replace(namedDue, (_, sep) => name + sep + label);
                    }
                }
            }
            dueWeekday.lastIndex = 0;
            if (dueWeekday.test(out)) {
                dueWeekday.lastIndex = 0;
                const past = assignments.find(a => {
                    const d = parseDate(a.due_date);
                    return d && daysFromToday(d) < 0;
                });
                const upcoming = assignments.find(a => {
                    const d = parseDate(a.due_date);
                    return d && daysFromToday(d) >= 0;
                });
                const any = past || upcoming || assignments[0];
                if (any) {
                    const label = formatDueLabel(any, { isMissing: missingNames.has(any.description) });
                    out = out.replace(dueWeekday, label);
                }
            }
            return out;
        }

        function rewritePhantomZeroCopy(text) {
            if (!text) return text;
            let out = String(text);
            out = out.replace(/\bGrade at 0%/gi, 'No grade yet');
            out = out.replace(/\bat 0%/gi, 'with no grade yet');
            out = out.replace(/\b0%\s+needs attention/gi, 'no grade yet needs attention');
            out = out.replace(/\bposted grade remains 0%/gi, 'no grade posted yet');
            out = out.replace(/\bremains 0%/gi, 'is not posted yet');
            out = out.replace(/(?<![\d.])0%/g, 'no grade yet');
            return out;
        }

        function rewriteStaleCopy(text, profile) {
            if (!text) return text;
            let out = rewriteStaleDueCopy(text, profile);
            if (isPhantomZero(profile.classMeta, profile.assignments)) {
                out = rewritePhantomZeroCopy(out);
            }
            return out;
        }

        function pickTonightItems(profiles) {
            // Due today, then Aeries-flagged missing, then due tomorrow. Turned-in work never appears.
            const dueToday = [];
            const missing = [];
            const dueTomorrow = [];
            for (const p of profiles || []) {
                const className = (p.classMeta && p.classMeta.course_name) || '';
                const item = (a, status) => ({ name: a.description, className, period: p.period, status, dueDate: a.due_date });
                for (const a of p.upcoming || []) {
                    if (!a.description) continue;
                    if (isDueTodayUngraded(a)) dueToday.push(item(a, 'today'));
                    else if (isDueInDaysUngraded(a, 1)) dueTomorrow.push(item(a, 'tomorrow'));
                }
                for (const a of p.missing || []) {
                    if (a.description && !isTurnedIn(a)) missing.push(item(a, 'overdue'));
                }
            }
            const seen = new Set();
            const items = [];
            for (const item of dueToday.concat(missing, dueTomorrow)) {
                const key = `${normalizeName(item.className)}|${(item.name || '').toLowerCase()}`;
                if (seen.has(key)) continue;
                seen.add(key);
                items.push(item);
                if (items.length >= 3) break;
            }
            return items;
        }

        function mergeTonightItems(primary, extra) {
            const seen = new Set();
            const out = [];
            for (const item of (primary || []).concat(extra || [])) {
                if (!item || !item.name) continue;
                const key = `${normalizeName(item.className)}|${item.name.toLowerCase()}`;
                if (seen.has(key)) continue;
                seen.add(key);
                out.push(item);
                if (out.length >= 3) break;
            }
            return out;
        }

        function formatTonightLabel(items) {
            return (items || []).map(i => `${i.name} (${i.className})`).join('; ');
        }

        function tonightItemStatus(item) {
            if (item.status === 'overdue') {
                const due = parseDate(item.dueDate);
                return { cls: 'overdue', text: due ? `overdue since ${formatShortDate(due)}` : 'overdue' };
            }
            if (item.status === 'today') return { cls: 'today', text: 'due today' };
            if (item.status === 'tomorrow') return { cls: 'tomorrow', text: 'due tomorrow' };
            return { cls: '', text: '' };
        }

        function tonightStatusFromReason(reason) {
            return { due_today: 'today', missing: 'overdue', due_tomorrow: 'tomorrow' }[reason] || '';
        }

        // Fill in period/status for server-provided tonight rows by matching against the profiles.
        function resolveTonightItems(items, profiles) {
            const out = [];
            for (const item of items || []) {
                const row = { ...item };
                let hit = null;
                let hitProfile = null;
                for (const p of profiles || []) {
                    const cn = (p.classMeta && p.classMeta.course_name) || '';
                    if (item.className && normalizeName(cn) !== normalizeName(item.className)) continue;
                    hit = (p.assignments || []).find(a => a.description === item.name);
                    if (!hit) continue;
                    hitProfile = p;
                    if (row.period == null) row.period = p.period;
                    if (!row.dueDate) row.dueDate = hit.due_date;
                    break;
                }
                if (hit) {
                    // Work Aeries shows as handed in or already scored is not a to-do, whatever the payload said.
                    if (isTurnedIn(hit) || assignmentHasScoreMark(hit)) continue;
                    const flagged = (hitProfile.missing || []).includes(hit);
                    // Past due but not flagged missing is "awaiting score" — not something to do tonight.
                    if (isPastDueUngraded(hit) && !flagged) continue;
                    // Re-derive the status from the row itself rather than trusting a stored reason.
                    row.status = flagged ? 'overdue'
                        : (isDueTodayUngraded(hit) ? 'today' : (isDueInDaysUngraded(hit, 1) ? 'tomorrow' : row.status || ''));
                    if (!row.status) continue;
                }
                out.push(row);
            }
            return out;
        }

        function renderTonightCard(items, idx) {
            const chevron = `<svg class="row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>`;
            const rows = items.map(item => {
                const st = tonightItemStatus(item);
                const sub = [
                    st.text ? `<span class="status ${st.cls}">${esc(st.text)}</span>` : '',
                    item.className ? esc(item.className) : '',
                ].filter(Boolean).join(' · ');
                const linkable = item.period != null;
                const tag = linkable ? 'button' : 'div';
                const attrs = linkable
                    ? ` type="button" data-jump-student="${idx}" data-jump-period="${item.period}" aria-label="${esc(item.name)} — open ${esc(item.className || 'class')}"`
                    : '';
                return `<li><${tag} class="tonight-item"${attrs}>
                    <span class="tonight-item-main">
                        <span class="tonight-item-name">${esc(item.name)}</span>
                        ${sub ? `<span class="tonight-item-sub">${sub}</span>` : ''}
                    </span>
                    ${linkable ? chevron : ''}
                </${tag}></li>`;
            }).join('');
            return `<div class="masthead-tonight" id="focus-card-${idx}">
                <div class="label">Heads up</div>
                <ul class="tonight-list">${rows}</ul>
            </div>`;
        }

        function liveDoTonight(profile) {
            const dueToday = (profile.upcoming || []).find(isDueTodayUngraded);
            if (dueToday && dueToday.description) return dueToday.description;
            const miss = (profile.missing || []).find(a => a.description && !isTurnedIn(a));
            if (miss) return miss.description;
            const dueTomorrow = (profile.upcoming || []).find(a => isDueInDaysUngraded(a, 1));
            return (dueTomorrow && dueTomorrow.description) || '';
        }

        function snapNamesStaleWork(snap, profile) {
            if (!snap) return false;
            if (/\bdue\s+(Mon|Tue|Wed|Thu|Fri|Sat|Sun|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\b(?!\s+[A-Za-z]{3}\s+\d)/i.test(snap)) {
                return true;
            }
            for (const a of profile.assignments || []) {
                if (!a.description || snap.indexOf(a.description) === -1) continue;
                const due = parseDate(a.due_date);
                if (!due || daysFromToday(due) >= 0) continue;
                if (/\bdue\b/i.test(snap)) return true;
            }
            return false;
        }

        function inferUrgency(profile, aiClass) {
            const mc = profile.missingCount;
            const dueToday = (profile.upcoming || []).some(isDueTodayUngraded);
            if (!hasRealGrade(profile.classMeta, profile.assignments)) {
                if (mc > 0 || dueToday) return 'watch';
                return 'ok';
            }
            const pct = parseFloat(profile.classMeta.percent);
            const belowB = !isNaN(pct) && pct < 80;
            const belowC = !isNaN(pct) && pct < 70;
            if (belowC || belowB) return 'critical';
            if (mc > 0 && !isNaN(pct) && pct >= 80) return 'watch';
            if (dueToday) return 'watch';
            if (!isNaN(pct) && pct >= 90 && mc === 0) return 'strong';
            const aiUrgency = (aiClass?.urgency || '').toLowerCase();
            if ((aiUrgency === 'watch' || aiUrgency === 'critical') && mc === 0 && !dueToday) {
                return (!isNaN(pct) && pct >= 90) ? 'strong' : 'ok';
            }
            if (aiUrgency) return aiUrgency;
            return 'ok';
        }

        function inferUrgencyReason(profile, urgency) {
            const mc = profile.missingCount;
            if (!hasRealGrade(profile.classMeta, profile.assignments)) {
