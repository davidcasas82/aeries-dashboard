                return mc > 0 ? `${mc} missing` : 'No grade yet';
            }
            const mark = profile.classMeta.mark || '';
            const pct = profile.classMeta.percent ? Math.round(parseFloat(profile.classMeta.percent)) + '%' : '';
            const awaitingN = profile.awaitingCount || (profile.awaiting || []).length;
            if (mc === 0 && awaitingN > 0) {
                const posted = `${mark} ${pct}`.trim();
                return posted ? `Posted ${posted} · ${awaitingN} awaiting score` : `${awaitingN} awaiting score`;
            }
            if (urgency === 'watch') {
                return `${mark} ${pct} · ${mc} missing`.trim();
            }
            if (urgency === 'critical') {
                return mc > 0 ? `At risk · ${mc} missing` : 'Needs improvement';
            }
            if (urgency === 'strong') return 'On track';
            return '';
        }

        // Apply the truth rules (urgency, snap/story rewrites, heads-up pick) to a base profile.
        // Used for both the raw-assignment path and the server view payload, so neither path
        // can show copy the current rules would not produce.
        function enrichProfile(p, aiClass) {
            const urgency = inferUrgency(p, aiClass);
            let snap = (aiClass?.snap || inferUrgencyReason(p, urgency) || '').trim();
            snap = rewriteStaleCopy(snap, p);
            if (snapNamesStaleWork(snap, p) || snapClaimsMissing(snap, p) || snapClaimsFalseOverdue(snap, p)) {
                const fallback = inferUrgencyReason(p, urgency) || '';
                snap = rewriteStaleCopy(fallback, p) || fallback;
            }
            const story = rewriteStaleCopy((aiClass?.story || '').trim(), p);
            return {
                ...p,
                aiClass: aiClass ? { ...aiClass, snap, story } : aiClass,
                urgency,
                snap,
                story,
                liveDoTonight: liveDoTonight(p),
                urgencyRank: urgencyToRank(urgency),
            };
        }

        // "2 missing" in a snap written under older rules when Aeries now flags none.
        function snapClaimsMissing(snap, profile) {
            if (!snap) return false;
            const m = snap.match(/\b(\d+)\s+missing\b/i);
            if (!m) return false;
            return parseInt(m[1], 10) !== (profile.missingCount || 0);
        }

        function snapClaimsFalseOverdue(snap, profile) {
            if (!snap || !/\boverdue\b/i.test(snap)) return false;
            if ((profile.missingCount || 0) > 0) return false;
            return (profile.awaitingCount || (profile.awaiting || []).length) > 0;
        }

        function enrichProfiles(student, profiles) {
            return profiles.map(p => {
                const rawAi = findAiClass(student, p.classMeta.course_name);
                return enrichProfile(p, normalizeAiClass(rawAi));
            }).sort((a, b) => a.period - b.period);
        }

        function formatGradeDisplay(c, assignments) {
            const mark = (c.mark || '').trim();
            const raw = c.percent;
            const hasPct = raw !== undefined && raw !== null && String(raw).trim() !== '';
            const pctNum = hasPct ? parseFloat(raw) : NaN;
            const pct = !isNaN(pctNum) ? Math.round(pctNum) : null;
            // Treat phantom 0% with no letter mark as "no grade yet"
            if (!mark && (pct === null || pct === 0) && !hasRealGrade(c, assignments)) {
                return { letter: '—', pct: '' };
            }
            if (mark && pct !== null) return { letter: mark, pct: pct + '%' };
            if (mark) return { letter: mark, pct: '' };
            if (pct !== null) return { letter: pct + '%', pct: '' };
            return { letter: '—', pct: '' };
        }

        function renderMovers(student) {
            const summary = (student.trend_summary || []).filter(t => {
                if (t.delta == null || t.delta === 0) return false;
                return !isFirstPostedGradeDelta(findClassTrend(student, t.class_name), t.delta);
            });
            if (!summary.length) return '';
            const items = summary.slice(0, 4).map(t => {
                const dir = t.direction || (t.delta > 0 ? 'up' : (t.delta < 0 ? 'down' : 'same'));
                const deltaStr = formatTrendDelta(t.delta);
                return `<span class="mover ${dir}">
                    <span class="name">${esc(t.class_name || '')}</span>
                    <span class="delta">${deltaStr}</span>
                    <span class="win">${t.window || ''}</span>
                </span>`;
            }).join('');
            return `<div class="masthead-movers">
                <span class="movers-label">Trend</span>
                ${items}
            </div>`;
        }

        function renderAttendanceStats(student) {
            const a = student.attendance;
            if (!a || a.parse_failed) return '';
            const chips = [];
            const notStarted = !!(a.not_started || ((a.days_enrolled == null || a.days_enrolled === 0) && a.absences === 0 && a.tardies === 0));
            const plural = (n, one, many) => (n === 1 ? one : many);
            if (a.absences != null) {
                const cls = a.absences >= 5 ? 'alert' : (a.absences > 0 ? 'warn' : 'ok');
                chips.push(`<span class="masthead-stat ${cls}"><span class="stat-num">${a.absences}</span><span class="stat-lbl">${plural(a.absences, 'absence', 'absences')}</span></span>`);
            }
            if (a.tardies != null) {
                const cls = a.tardies >= 5 ? 'alert' : (a.tardies > 0 ? 'warn' : 'ok');
                chips.push(`<span class="masthead-stat ${cls}"><span class="stat-num">${a.tardies}</span><span class="stat-lbl">${plural(a.tardies, 'tardy', 'tardies')}</span></span>`);
            }
            if (a.unexcused != null && a.unexcused > 0) {
                chips.push(`<span class="masthead-stat alert"><span class="stat-num">${a.unexcused}</span><span class="stat-lbl">unexcused</span></span>`);
            }
            if (a.days_present != null && a.days_enrolled != null && a.days_enrolled > 0) {
                chips.push(`<span class="masthead-stat ok"><span class="stat-num">${a.days_present}/${a.days_enrolled}</span><span class="stat-lbl">present</span></span>`);
            } else if (notStarted) {
                chips.push(`<span class="masthead-stat ok masthead-stat-text">year not started</span>`);
            }
            if (a.year) {
                // Normalize 2025-2026 → “2025–26 school year”
                let yearLabel = String(a.year);
                const ym = yearLabel.match(/^(20\d{2})-20(\d{2})$/);
                if (ym) yearLabel = `${ym[1]}–${ym[2]} school year`;
                chips.push(`<span class="masthead-stat masthead-stat-text">${yearLabel}</span>`);
            }
            if (!chips.length) return '';
            return `<div class="masthead-stats">${chips.join('')}</div>`;
        }

        function hasGradedClasses(student) {
            return (student.classes || []).some(c => hasRealGrade(c, assignmentsForClassMeta(student, c)));
        }

        function hasScheduledClasses(student) {
            return (student.classes || []).some(c => (c.course_name || '').trim());
        }

        function hasPostedWork(student) {
            if (hasGradedClasses(student)) return true;
            if ((student.assignments_by_class || []).some(ca => (ca.assignments || []).length)) return true;
            const ai = student.ai_summary;
            if (ai && ((ai.focus_tonight || '').trim() || (ai.classes || []).length)) return true;
            return false;
        }

        function isSummerMode() {
            return !!(currentData && currentData.summer_break) || document.body.classList.contains('summer-break');
        }

        function isScheduleOnly(student) {
            return hasScheduledClasses(student) && !hasPostedWork(student);
        }

        function renderMasthead(student, idx, profiles) {
            const s = student.ai_summary;
            const scheduleOnly = isScheduleOnly(student);
            const emptyTerm = !hasScheduledClasses(student);
            const summer = isSummerMode() && emptyTerm;
            const viewTonight = (!summer && !scheduleOnly && student.view && Array.isArray(student.view.tonight))
                ? student.view.tonight.map(i => ({
                    name: i.name,
                    className: i.class_name || i.className,
                    period: i.period,
                    status: i.status || tonightStatusFromReason(i.reason),
                    dueDate: i.due_date,
                }))
                : null;
            // The live pick from the (already rule-checked) profiles is the source of truth; payload
            // rows only supplement it, and go through the same guards so stale ones drop out.
            const tonightItems = (!summer && !scheduleOnly)
                ? mergeTonightItems(
                    pickTonightItems(profiles || []),
                    resolveTonightItems(viewTonight || [], profiles),
                )
                : [];
            // Build the label from the resolved items so a dropped (turned-in) item can't linger in it.
            const focus = formatTonightLabel(tonightItems);
            studentFocusMap[idx] = focus;
            studentTonightMap[idx] = tonightItems;
            const attendanceHtml = renderAttendanceStats(student);

            // True summer with no schedule: clear empty-state message
            if (summer || (emptyTerm && isSummerMode())) {
                const dateStr = (s && s.generated_at)
                    ? new Date(s.generated_at).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })
                    : '';
                let html = `<div class="masthead" id="hero-card-${idx}">`;
                html += `<div class="masthead-kicker"><h2>Briefing</h2>`;
                if (dateStr) html += `<span class="masthead-date">${dateStr}</span>`;
                html += `</div>`;
                html += `<div class="masthead-headline">School year is out — no current classes or missing work in the portal.</div>`;
                html += attendanceHtml;
                html += `</div>`;
                return html;
            }

            // Schedules posted, no real grades yet
            if (scheduleOnly) {
                const dateStr = (s && s.generated_at)
                    ? new Date(s.generated_at).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })
                    : '';
                const n = (student.classes || []).filter(c => (c.course_name || '').trim()).length;
                let headline = (s && s.headline) ? String(s.headline).trim() : '';
                if (!headline || /school year is out|no current classes or missing work/i.test(headline)) {
                    headline = `Schedules are up (${n} classes) — no grades posted yet.`;
                }
                let html = `<div class="masthead" id="hero-card-${idx}">`;
                html += `<div class="masthead-kicker"><h2>Briefing</h2>`;
                if (dateStr) html += `<span class="masthead-date">${dateStr}</span>`;
                html += `</div>`;
                html += `<div class="masthead-headline">${esc(headline)}</div>`;
                html += attendanceHtml;
                html += `</div>`;
                return html;
            }

            if (!s) {
                return `<div class="masthead" id="hero-card-${idx}">
                    <div class="masthead-kicker"><h2>Briefing</h2></div>
                    <div class="masthead-headline muted">No briefing yet</div>
                    ${attendanceHtml}
                    ${renderMovers(student)}
                </div>`;
            }

            const dateStr = s.generated_at
                ? new Date(s.generated_at).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })
                : '';
            let headline = (s.headline || s.status || '').trim();
            // Guard against old bad empty-term headlines once grades exist
            if (/no classes or missing work listed|mixed or stable performance/i.test(headline) && emptyTerm) {
                headline = 'School year is out — no current classes or missing work in the portal.';
            }
            const headlineNamesStaleTonight = (profiles || []).some(p =>
                (p.assignments || []).some(a =>
                    a.description && headline.indexOf(a.description) !== -1
                    && isPastDueUngraded(a)
                    && !tonightItems.some(i => i.name === a.description)
                )
            );
            if (headlineNamesStaleTonight) {
                const first = tonightItems[0];
                const phrase = first && first.status === 'tomorrow' ? 'is due tomorrow'
                    : first && first.status === 'overdue' ? 'is still missing'
                    : 'is due today';
                if (tonightItems.length === 1) {
                    headline = `${first.name} ${phrase} in ${first.className}.`;
                } else if (tonightItems.length > 1) {
                    headline = `Heads up: ${focus}.`;
                } else if (s.wins && s.wins[0]) {
                    headline = s.wins[0];
                } else {
                    headline = '';
                }
            }
            const allAssignments = [];
            for (const p of profiles || []) {
                allAssignments.push(...(p.assignments || []));
            }
            headline = rewriteStaleDueCopy(headline, { assignments: allAssignments, missing: (profiles || []).flatMap(p => p.missing || []) });
            if ((profiles || []).some(p => isPhantomZero(p.classMeta, p.assignments))) {
                headline = rewritePhantomZeroCopy(headline);
            }
            const awaitingOnly = (profiles || []).some(p => (p.awaitingCount || (p.awaiting || []).length) > 0 && !p.missingCount);
            const anyMissing = (profiles || []).some(p => p.missingCount > 0);
            if (awaitingOnly && !anyMissing) {
                headline = headline
                    .replace(/\bwith two overdue assignments\b/i, 'with work awaiting a teacher score')
                    .replace(/\bwith an overdue assignment\b/i, 'with work awaiting a teacher score')
                    .replace(/\btwo overdue assignments\b/i, 'two assignments awaiting a score')
                    .replace(/\boverdue assignments\b/i, 'assignments awaiting a score');
            }

            let html = `<div class="masthead" id="hero-card-${idx}">`;
            html += `<div class="masthead-kicker"><h2>Briefing</h2>`;
            if (dateStr) html += `<span class="masthead-date">${dateStr}</span>`;
            html += `</div>`;
            if (headline) html += `<div class="masthead-headline">${esc(headline)}</div>`;

            if (tonightItems.length) {
                html += renderTonightCard(tonightItems, idx);
            } else if (focus) {
                html += `<div class="masthead-tonight" id="focus-card-${idx}">
                    <div class="label">Heads up</div>
                    <div class="text">${esc(focus)}</div>
                </div>`;
            }

            const wins = (student.view && student.view.wins && student.view.wins.length)
                ? student.view.wins
                : (s.wins || []);
            if (wins.length) {
                html += `<div class="masthead-wins">`;
                wins.slice(0, 2).forEach(win => {
                    html += `<div class="win-line">${esc(win)}</div>`;
                });
                html += `</div>`;
            }

            // Legacy schemas
            if (!s.classes) {
                if (s.whats_happened && s.whats_happened.length) {
                    html += `<div class="masthead-wins" style="margin-top:10px">`;
                    s.whats_happened.slice(0, 3).forEach(item => {
                        const event = (typeof item === 'string') ? item : (item.event || '');
                        html += `<div class="win-line" style="color:var(--text-2)">${esc(event)}</div>`;
                    });
                    html += `</div>`;
                }
            }

            html += attendanceHtml;
            html += renderMovers(student);
            html += `</div>`;
            return html;
        }

        function formatSessionDay(iso) {
            if (!iso) return '';
            const d = new Date(`${iso}T12:00:00`);
            if (Number.isNaN(d.getTime())) return '';
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function renderEmptyTermCard() {
            const sess = (currentData && currentData.school_session) || {};
            const last = formatSessionDay(sess.last_day);
            const resume = formatSessionDay(sess.next_first_day) || formatSessionDay(sess.first_day);
            const lastLine = last
                ? `Tustin USD’s last day was ${last}. `
                : '';
            const resumeLine = resume
                ? `Grades resume after first day — ${resume}`
                : 'Grades resume on the first instructional day.';
            return `
                <div class="empty-term-card">
                    <h3>School year ended</h3>
                    <p>${lastLine}The parent portal isn’t listing current classes or missing work while school is out.</p>
                    <div class="resume">${resumeLine}</div>
                </div>`;
        }

        function dedupeStudentClasses(classes) {
            // Client-side safety net matching scraper: same period + course → keep richest row
            if (!Array.isArray(classes) || classes.length < 2) return classes || [];
            const best = new Map();
            const order = [];
            const richness = (c) => {
                let s = 0;
                const pct = String(c.percent ?? '').trim();
                const mark = String(c.mark ?? '').trim();
                if (pct) {
                    s += 2;
                    const n = parseFloat(pct);
                    if (!isNaN(n) && n > 0) s += 2;
                }
                if (mark) s += 3;
                if (c.missing_count) s += 1;
                if (String(c.missing_assignments || '').trim()) s += 1;
                if (String(c.trend || '').trim()) s += 1;
                return s;
            };
            for (const c of classes) {
                const key = `${c.period}::${String(c.course_name || '').trim().toLowerCase().replace(/\s+/g, ' ')}`;
                if (!best.has(key)) {
                    best.set(key, c);
                    order.push(key);
                } else if (richness(c) > richness(best.get(key))) {
                    best.set(key, c);
                }
            }
            return order.map(k => best.get(k));
        }

        function renderAssignmentList(assignments, kind, insight) {
            if (!assignments.length) return '';
            const sorted = [...assignments].sort((a, b) => {
                const da = parseDate(a.due_date);
                const db = parseDate(b.due_date);
                if (!da && !db) return 0;
                if (!da) return 1;
                if (!db) return -1;
                return da - db;
            });
            let html = `<div class="list-panel">`;
            if (kind === 'missing' || kind === 'awaiting') {
                for (const a of sorted) {
                    html += renderAssignmentRow(a, kind, insight);
                }
                return html + '</div>';
            }
            // Upcoming reads soonest-first; the full list reads newest-first.
            const ordered = kind === 'all' ? sorted.reverse() : sorted;
            const bucketOrder = kind === 'all' ? [...WEEK_BUCKET_ORDER].reverse() : WEEK_BUCKET_ORDER;
            const groups = new Map();
            for (const a of ordered) {
                const week = getWeekLabel(parseDate(a.due_date));
                if (!groups.has(week)) groups.set(week, []);
                groups.get(week).push(a);
            }
            for (const week of bucketOrder) {
                const items = groups.get(week);
                if (!items || !items.length) continue;
                html += `<div class="week-label">${week}</div>`;
                for (const a of items) {
                    html += renderAssignmentRow(a, kind, insight);
                }
            }
            return html + '</div>';
        }

        function renderAssignmentRow(a, kind, insight) {
            const due = parseDate(a.due_date);
            // A past date only reads as "overdue" when nothing has been scored yet.
            // Awaiting-score dates stay gray: past due is not the same as missing.
            const awaitingLike = isPastDueUngraded(a) && !isAeriesFlaggedMissing(a);
            const dateClass = kind === 'missing' ? 'overdue'
                : kind === 'awaiting' ? ''
                : (assignmentHasScoreMark(a) || awaitingLike ? '' : getDateClass(due));
            const dateHtml = kind === 'missing'
                ? formatShortDate(due)
                : `${formatDayOfWeek(due)} ${formatShortDate(due)}`;

            const st = inferAssignmentStatus(a, insight);
            const score = assignmentScoreDisplay(a);
            let scoreHtml = '';
            if (kind === 'missing' || kind === 'awaiting') {
                scoreHtml = a.points_possible
                    ? `<span class="pts-badge${kind === 'awaiting' ? ' muted' : ''}">${a.points_possible} pts</span>`
                    : '';
            } else if (kind === 'upcoming' && !assignmentHasScoreMark(a)) {
                scoreHtml = `<span class="badge badge-upcoming">Due</span>`;
            } else {
                scoreHtml = `<div class="score ${score.cls}">${esc(score.text)}</div>
                    ${score.pct ? `<div class="max">${esc(score.pct)}</div>` : ''}`;
            }

            const comment = (a.comment || '').trim();
            // "counts in <Category>" repeats the category line — collapse to one line in that case.
            const cat = (a.category || '').trim();
            const labelRepeatsCategory = cat && normalizeName(st.label) === normalizeName(`counts in ${cat}`);
            const metaLine = labelRepeatsCategory
                ? `<div class="assn-status ${st.status}">${esc(cat)}</div>`
                : `${cat ? `<div class="assignment-meta">${esc(cat)}</div>` : ''}${st.label ? `<div class="assn-status ${st.status}">${esc(st.label)}</div>` : ''}`;

            return `
                <div class="assignment-row">
                    <div class="assignment-date ${dateClass}">${dateHtml || ''}</div>
                    <div class="assignment-info">
                        <div class="title">${esc(a.description || '')}</div>
                        ${metaLine}
                        ${comment ? `<div class="assignment-meta">${esc(comment)}</div>` : ''}
                    </div>
                    <div class="assignment-score">${scoreHtml}</div>
                </div>`;
        }

        function formatPostedGrade(c, assignments) {
            const g = formatGradeDisplay(c, assignments);
            const parts = [g.letter, g.pct && g.letter !== g.pct ? g.pct : ''].filter(Boolean);
            return parts.join(' ') || '—';
        }

        function renderCountedInsight(c, assignments) {
            const insight = c.counted_insight;
            if (!insight || !(insight.categories || []).length) return '';
            const posted = isPhantomZero(c, assignments)
                ? 'not posted yet'
                : formatPostedGrade(c, assignments);
            const rows = (insight.categories || []).map(cat => {
                const weight = cat.weight_pct == null ? '' : `${cat.weight_pct}% of grade`;
                let meta = '';
                if (cat.reason === 'empty_0_0') {
                    meta = `${weight} · empty (not in mix yet)`;
                } else if (cat.reason === 'zero_weight') {
                    meta = '0% category (doesn\'t count)';
                } else if (cat.reason === 'extra_credit') {
                    meta = 'extra credit';
                } else if (cat.counts && cat.perc != null) {
                    meta = `${weight} · ${Number(cat.perc).toFixed(0)}%`;
                } else if (weight) {
                    meta = weight;
                }
                const cls = cat.counts ? 'counts' : 'dropped';
                return `<div class="cat-mix-row ${cls}">
                    <span class="cat-name">${esc(cat.name || '')}</span>
                    <span class="cat-meta">${esc(meta)}</span>
                </div>`;
            }).join('');

            let rebuild = '';
            if (insight.rebuild_pct != null) {
                const match = insight.matches_posted
                    ? 'matches posted'
                    : 'differs — posted stays official';
                rebuild = `<details class="rebuild-debug">
                    <summary>Our rebuild (hidden by default)</summary>
                    <p>${Number(insight.rebuild_pct).toFixed(1)}% (${match}). This is not the class grade.</p>
                </details>`;
            }
            const scale = (insight.min_assignment_pct != null || insight.max_assignment_pct != null)
                ? `<div class="counted-note">Assignment scale in effect: min ${insight.min_assignment_pct ?? '—'}% · max ${insight.max_assignment_pct ?? '—'}%.</div>`
                : '';

            return `<div class="panel-block">
                <div class="panel-block-label">What counts</div>
                <div class="counted-insight">
                    <div class="counted-note">Aeries posted grade is <strong>${posted}</strong> — not an average of assignment %.</div>
                    ${rows}
                    ${scale}
                    ${rebuild}
                </div>
            </div>`;
        }

        function renderClassPanel(profile, student) {
            const c = profile.classMeta;
            const ai = normalizeAiClass(profile.aiClass);
            const story = (profile.story || ai?.story || '').trim();
            const doTonight = (profile.liveDoTonight || '').trim();
            const snap = (profile.snap || '').trim();
            // The snap already shows on the collapsed row; only repeat it here when there is no real story.
            // A briefing written under older rules may still claim missing work the portal doesn't flag.
            const storyClaimsMissing = /\bmissing\b/i.test(story) && (profile.missingCount || 0) === 0;
            const storyText = story && !storyClaimsMissing && normalizeName(story) !== normalizeName(snap) ? story : '';
            const realGrade = hasRealGrade(c, profile.assignments);
            const phantomZero = isPhantomZero(c, profile.assignments);
            const gradeClass = realGrade ? getGradeClass(c.percent) : 'grade-none';
            const gradeIsText = phantomZero || !realGrade;
            const gradeShow = gradeIsText
                ? 'No grade yet'
                : formatPostedGrade(c, profile.assignments);

            const t = findClassTrend(student, c.course_name);
            const hist = historyWithoutLeadingPhantom(t?.pct_history || []);
            const { delta, window } = pickTrendDelta(t);
            const deltaStr = formatTrendDelta(delta);
            const dir = delta == null || delta === 0 ? '' : (delta > 0 ? 'up' : 'down');
            const spark = renderSparkline(hist, 280, 36, 2);

            const teacher = (c.teacher || '').replace(/,\s*$/, '').trim();
            const room = (c.room || '').trim();
            const teacherLine = [teacher, room ? `Rm ${room}` : ''].filter(Boolean).join(' · ');

            const missingTile = (!realGrade && profile.missingCount === 0)
                ? ''
                : `<div class="stat-tile">
                    <div class="stat-label">Missing</div>
                    <div class="stat-value ${profile.missingCount > 0 ? 'alert' : ''}">${profile.missingCount}</div>
                </div>`;
            const awaitingCount = profile.awaitingCount || (profile.awaiting || []).length;
            const staleCount = profile.staleAwaitingCount || 0;
            const awaitingTile = awaitingCount > 0
                ? `<div class="stat-tile" title="Past due, not scored yet, and not flagged missing in Aeries">
                    <div class="stat-label">Awaiting</div>
                    <div class="stat-value ${staleCount > 0 ? 'stale' : 'quiet'}">${awaitingCount}</div>
                </div>`
                : '';

            // Stats row
            let stats = `<div class="panel-stats">
                <div class="stat-tile">
                    <div class="stat-label">${realGrade ? 'Posted' : 'Grade'}</div>
                    <div class="stat-value ${gradeClass}${gradeIsText ? ' sm' : ''}">${gradeShow || '—'}</div>
                </div>
                <div class="stat-tile">
                    <div class="stat-label">Change</div>
                    <div class="stat-value ${dir || ''}">${deltaStr != null ? deltaStr + (window ? ' · ' + window : '') : '—'}</div>
                </div>
                ${missingTile}
                ${awaitingTile}
                <div class="stat-tile">
                    <div class="stat-label">Upcoming</div>
                    <div class="stat-value">${profile.upcoming.length}</div>
                </div>
            </div>`;

            let blocks = '';

            if (teacherLine) {
                blocks += `<div class="panel-meta-line">${esc(teacherLine)}</div>`;
            }
            if (awaitingCount > 0 && realGrade) {
                blocks += `<div class="panel-meta-line">Posted grade may move when the teacher scores the ${awaitingCount === 1 ? 'assignment' : 'assignments'} below.</div>`;
            }

            if (doTonight) {
                blocks += `<div class="panel-block panel-block-tonight">
                    <div class="panel-block-label tonight">Heads up</div>
                    <div class="panel-tonight-text">${esc(doTonight)}</div>
                </div>`;
            }

            if (storyText) {
                blocks += `<div class="panel-block">
                    <div class="panel-block-label">Summary</div>
                    <div class="panel-story">${esc(storyText)}</div>
                </div>`;
            }

            blocks += renderCountedInsight(c, profile.assignments);

            if (spark || deltaStr != null) {
                let caption = '';
                const firstDate = hist[0] && hist[0].date
                    ? new Date(`${hist[0].date}T12:00:00`).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
                    : '';
                const windowLabel = window === '7d' ? 'over 7 days'
                    : window === '14d' ? 'over 14 days'
                    : window && window.endsWith('d') ? `over ${window.replace('d', ' days')}`
                    : window ? `over ${window}` : '';
                if (deltaStr != null) {
                    caption = `<span class="delta ${dir}">${deltaStr} pts</span>`;
                    if (windowLabel) caption += ` ${windowLabel}`;
                    else if (firstDate) caption += ` since ${firstDate}`;
                } else if (firstDate) {
                    caption = `Grade since ${firstDate}`;
                }
                blocks += `<div class="panel-block">
                    <div class="panel-block-label">Trend</div>
                    <div class="panel-trend">
                        ${spark ? `<div class="panel-trend-chart">${spark}</div>` : ''}
                        ${caption ? `<div class="panel-trend-caption">${caption}</div>` : ''}
                    </div>
                </div>`;
            }

            // Assignment sections — action lists plus the honest full list
            const insight = c.counted_insight;
            const listBlocks = [];
            if (profile.missing.length) {
                const newly = (profile.newlyMissing || []).filter(n =>
                    profile.missing.some(a => normalizeName(a.description) === normalizeName(n))
                );
                const newNote = newly.length
                    ? `<span class="label-note">new since last check</span>`
                    : '';
                listBlocks.push(`<div class="panel-block">
                    <div class="panel-block-label alert">Missing <span class="count">${profile.missing.length}</span>${newNote}</div>
                    ${renderAssignmentList(profile.missing, 'missing', insight)}
                </div>`);
            }
            const awaiting = profile.awaiting || [];
            if (awaiting.length) {
                const staleNote = staleCount > 0
                    ? `<span class="label-note stale">${staleCount} worth asking about</span>`
                    : '';
                listBlocks.push(`<div class="panel-block">
                    <div class="panel-block-label quiet">Awaiting score <span class="count">${awaiting.length}</span>${staleNote}</div>
                    ${renderAssignmentList(awaiting, 'awaiting', insight)}
                </div>`);
            }
            if (profile.upcoming.length) {
                listBlocks.push(`<div class="panel-block">
                    <div class="panel-block-label">Upcoming <span class="count">${profile.upcoming.length}</span></div>
                    ${renderAssignmentList(profile.upcoming, 'upcoming', insight)}
                </div>`);
            }
            if (profile.assignments.length) {
                listBlocks.push(`<div class="panel-block full">
                    <div class="panel-block-label">All work <span class="count">${profile.assignments.length}</span></div>
                    ${renderAssignmentList(profile.assignments, 'all', insight)}
                </div>`);
            }

            if (listBlocks.length) {
                const twoCol = listBlocks.length >= 2 && (profile.missing.length || awaiting.length || profile.upcoming.length);
                blocks += `<div class="panel-lists ${twoCol ? 'two-col' : ''}">${listBlocks.join('')}</div>`;
            }

            if (!doTonight && !storyText && !spark && !listBlocks.length) {
                blocks += `<div class="panel-block"><p class="panel-empty">No extra detail for this class yet.</p></div>`;
            }

            if (listBlocks.length) {
                blocks += `<button type="button" class="panel-collapse" data-collapse-period="${profile.period == null ? '' : profile.period}">
                    <svg class="row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    Collapse ${esc(c.course_name || '')}
                </button>`;
            }

            return `<div class="class-panel">${stats}${blocks}</div>`;
        }

        function renderClassFeed(profiles, idx, student) {
            if (!profiles.length) return '';

            const focusCount = profiles.filter(p => p.urgency === 'critical' || p.urgency === 'watch').length;
            const chevron = `<svg class="row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>`;

            const rows = profiles.map(p => {
                const c = p.classMeta;
                const g = formatGradeDisplay(c, p.assignments);
                const gradeClass = hasRealGrade(c, p.assignments) ? getGradeClass(c.percent) : 'grade-none';
                const urgency = p.urgency || 'ok';
                // The pill already says "N missing"; don't echo it as the snap line.
                const rawSnap = p.snap || '';
                const snap = normalizeName(rawSnap) === normalizeName(`${p.missingCount} missing`) ? '' : rawSnap;
                const missingBadge = p.missingCount > 0
                    ? `<span class="row-missing">${p.missingCount} missing</span>`
                    : '';
                const awaitingN = p.awaitingCount || (p.awaiting || []).length;
                const awaitingBadge = awaitingN > 0
                    ? `<span class="row-awaiting${p.staleAwaitingCount > 0 ? ' stale' : ''}">${awaitingN} awaiting score</span>`
                    : '';

                const t = findClassTrend(student, c.course_name);
                const hist = t?.pct_history || [];
                const micro = renderSparkline(hist, 44, 16, 1.5);
                const { delta } = pickTrendDelta(t);
                const deltaStr = formatTrendDelta(delta);
                const dir = delta == null || delta === 0 ? '' : (delta > 0 ? 'up' : 'down');

                const letterShow = g.letter;
                const pctShow = g.pct && g.letter !== g.pct ? g.pct : '';
                const detailId = `${classRowId(idx, p.period)}-detail`;

                // Always start collapsed — no auto-expand
                return `
                    <div class="class-row urgency-${urgency}" id="${classRowId(idx, p.period)}">
                        <button type="button" class="class-row-btn" data-student-idx="${idx}" data-period="${p.period == null ? '' : p.period}" aria-expanded="false" aria-controls="${detailId}">
                            <span class="urgency-bar" aria-hidden="true"></span>
                            <span class="row-main">
                                <span class="row-title">
                                    <span class="row-period">P${p.period}</span>
                                    <span class="row-name">${esc(c.course_name)}</span>
                                    ${missingBadge}
                                    ${awaitingBadge}
                                </span>
                                ${snap ? `<span class="row-meta ${urgency === 'critical' || urgency === 'watch' ? urgency : ''}">${esc(snap)}</span>` : ''}
                            </span>
                            <span class="row-trail-wrap">
                                <span class="row-trail">
                                    <span class="row-grade">
                                        ${awaitingN > 0 && hasRealGrade(c, p.assignments) ? '<span class="pct">Posted</span>' : ''}
                                        <span class="letter ${gradeClass}">${esc(letterShow)}</span>
                                        ${pctShow ? `<span class="pct">${esc(pctShow)}</span>` : ''}
                                    </span>
                                    <span class="row-trend">
                                        ${micro}
                                        ${deltaStr != null && delta !== 0 ? `<span class="row-delta ${dir}">${deltaStr}</span>` : ''}
                                    </span>
                                </span>
                                ${chevron}
                            </span>
                        </button>
                        <div class="class-row-detail" id="${detailId}">
                            ${renderClassPanel(p, student)}
                        </div>
                    </div>`;
            }).join('');

            return `
                <div class="feed-header">
                    <h2>Classes</h2>
                    <span class="count">${formatClassesCount(focusCount, profiles.length)}</span>
                </div>
                <div class="class-feed">${rows}</div>`;
        }

        function isDesktopLayout() {
            return window.matchMedia('(min-width: 1100px)').matches;
        }

        function toggleClassCard(studentIdx, period) {
            const row = document.getElementById(classRowId(studentIdx, period));
            if (!row) return;
            const dashboard = document.getElementById(`dashboard-${studentIdx}`);
            const wasExpanded = row.classList.contains('expanded');
            const btn = row.querySelector('.class-row-btn');

            if (!isDesktopLayout()) {
                dashboard.querySelectorAll('.class-row.expanded').forEach(el => {
                    if (el !== row) {
                        el.classList.remove('expanded');
                        const b = el.querySelector('.class-row-btn');
                        if (b) b.setAttribute('aria-expanded', 'false');
                    }
                });
            }

            row.classList.toggle('expanded', !wasExpanded);
            if (btn) btn.setAttribute('aria-expanded', !wasExpanded ? 'true' : 'false');
        }

        function jumpToClass(studentIdx, period) {
            const row = document.getElementById(classRowId(studentIdx, period));
            if (!row) return;

            if (!isDesktopLayout()) {
                const dashboard = document.getElementById(`dashboard-${studentIdx}`);
                dashboard.querySelectorAll('.class-row.expanded').forEach(el => {
                    el.classList.remove('expanded');
                    const b = el.querySelector('.class-row-btn');
                    if (b) b.setAttribute('aria-expanded', 'false');
                });
            }
            row.classList.add('expanded');
            const btn = row.querySelector('.class-row-btn');
            if (btn) btn.setAttribute('aria-expanded', 'true');

            // The sticky bar shows once the Tonight card scrolls away, so include it in the offset
            // even if it is not visible yet.
            const sticky = document.getElementById('tonightSticky');
            let stickyH = 0;
            if (sticky && !sticky.hidden) {
                const wasVisible = sticky.classList.contains('visible');
                sticky.classList.add('visible');
                stickyH = sticky.offsetHeight;
                if (!wasVisible) sticky.classList.remove('visible');
            }
            const topBar = document.querySelector('.top-bar');
            const offset = (topBar ? topBar.offsetHeight : 0) + stickyH + 10;
            const y = row.getBoundingClientRect().top + window.scrollY - offset;
            window.scrollTo({ top: y, behavior: 'smooth' });
            if (btn) btn.focus({ preventScroll: true });
        }

        function profilesFromView(student) {
            const view = student.view;
            if (!view || !Array.isArray(view.classes) || !view.classes.length) return null;
            return view.classes.map(row => {
                const classMeta = (student.classes || []).find(c =>
                    c.period === row.period
                    && normalizeName(c.course_name) === normalizeName(row.course_name)
                ) || {
                    period: row.period,
                    course_name: row.course_name,
                    teacher: row.teacher,
                    room: row.room,
                    percent: row.percent,
                    mark: row.mark,
                    missing_count: row.missing_count,
                    counted_insight: row.counted_insight,
                    phantom_zero: row.phantom_zero,
                };
                if (row.counted_insight && !classMeta.counted_insight) {
                    classMeta.counted_insight = row.counted_insight;
                }
                if (row.phantom_zero && !classMeta.phantom_zero) {
                    classMeta.phantom_zero = true;
                }
                if ((row.pct_history || []).length) {
                    student.class_trends = student.class_trends || {};
                    if (!student.class_trends[row.course_name]) {
                        student.class_trends[row.course_name] = {
                            pct_history: row.pct_history,
                            delta_7d: row.delta_7d,
                            delta_14d: row.delta_14d,
                            delta_span: row.delta_span,
                            span_window: row.span_window,
                        };
                    }
                }
                // The payload may have been written by an older scraper. When the raw rows are
                // present, re-derive every list from them with the current rules; only fall back
                // to the payload's lists when there is nothing to derive from.
                const assignments = row.assignments || [];
                const hasRows = assignments.length > 0;
                const missing = hasRows ? filterMissingAssignments(assignments) : (row.missing || []);
                const awaiting = hasRows ? filterAwaitingAssignments(assignments, missing) : (row.awaiting || []);
                const upcoming = hasRows ? filterUpcomingAssignments(assignments) : (row.upcoming || []);
                const recent = hasRows ? filterScoredAssignments(assignments) : (row.recent || []);
                const base = {
                    classMeta,
                    assignments,
                    missing,
                    awaiting,
                    upcoming,
                    recent,
                    missingCount: hasRows ? missing.length : (row.missing_count || 0),
                    awaitingCount: awaiting.length,
                    staleAwaitingCount: hasRows
                        ? awaiting.filter(isStaleAwaiting).length
                        : (row.stale_awaiting_count || 0),
                    newlyMissing: row.newly_missing || [],
                    period: row.period,
                };
                const aiClass = normalizeAiClass({
                    snap: row.snap,
                    story: row.story,
                    do_tonight: row.do_tonight,
                    urgency: row.urgency,
                    class_name: row.course_name,
                });
                return enrichProfile(base, aiClass);
            }).sort((a, b) => (a.period ?? 99) - (b.period ?? 99));
        }

        function classRowId(studentIdx, period) {
            return `class-${studentIdx}-${period == null ? 'none' : period}`;
        }

        function renderStudent(student, idx) {
            // Dedupe phantom duplicate ClassSummary rows before building the feed
            student = { ...student, classes: dedupeStudentClasses(student.classes || []) };
            const profiles = profilesFromView(student)
                || enrichProfiles(student, buildClassProfiles(student));
            const noSchedule = !hasScheduledClasses(student) || profiles.length === 0;
            // True summer with nothing scheduled: empty-state card
            if (noSchedule && isSummerMode()) {
                return `
                    ${renderMasthead(student, idx, profiles)}
                    ${renderEmptyTermCard()}`;
            }
            // Schedule and/or grades: always show the class feed when we have rows
            const feed = profiles.length
                ? renderClassFeed(profiles, idx, student)
                : (isSummerMode() ? renderEmptyTermCard() : '');
            return `
                ${renderMasthead(student, idx, profiles)}
                ${feed}`;
        }

        function updateTopBarTitle() {
            if (!currentData || !currentData.students) return;
            const student = currentData.students[activeStudentIndex];
            const title = document.getElementById('topBarTitle');
            if (title && student) title.textContent = student.name || 'Grade Dashboard';
            updateTonightSticky();
        }

        function updateTonightSticky() {
            const sticky = document.getElementById('tonightSticky');
            const textEl = document.getElementById('tonightStickyText');
            if (!sticky || !textEl) return;

            const focus = studentFocusMap[activeStudentIndex] || '';
            if (!focus || document.body.classList.contains('summer-break')) {
                sticky.hidden = true;
                sticky.classList.remove('visible');
                textEl.textContent = '';
                return;
            }
            textEl.textContent = focus;
            sticky.hidden = false;
        }

        function setupTonightSticky() {
            const sticky = document.getElementById('tonightSticky');
            if (!sticky) return;

            sticky.addEventListener('click', () => {
                // Prefer opening the class the first Tonight item belongs to; fall back to the card.
                const first = (studentTonightMap[activeStudentIndex] || [])[0];
                if (first && first.period != null) {
                    jumpToClass(activeStudentIndex, first.period);
                    return;
                }
                const hero = document.getElementById(`focus-card-${activeStudentIndex}`)
                    || document.getElementById(`hero-card-${activeStudentIndex}`);
                if (!hero) return;
                const topBar = document.querySelector('.top-bar');
                const offset = (topBar ? topBar.offsetHeight : 0) + 8;
                const y = hero.getBoundingClientRect().top + window.scrollY - offset;
                window.scrollTo({ top: y, behavior: 'smooth' });
            });

            const onScroll = () => {
                const focus = studentFocusMap[activeStudentIndex] || '';
                if (!focus || document.body.classList.contains('summer-break')) {
                    sticky.classList.remove('visible');
                    return;
                }
                const focusCard = document.getElementById(`focus-card-${activeStudentIndex}`);
                if (!focusCard) {
                    sticky.classList.remove('visible');
                    return;
                }
                const rect = focusCard.getBoundingClientRect();
                const topBar = document.querySelector('.top-bar');
                const threshold = (topBar ? topBar.offsetHeight : 52) + 8;
                if (rect.bottom < threshold) sticky.classList.add('visible');
                else sticky.classList.remove('visible');
            };

            window.addEventListener('scroll', onScroll, { passive: true });
            window.addEventListener('resize', onScroll, { passive: true });
        }

        function switchStudent(index) {
            activeStudentIndex = index;
            document.querySelectorAll('.student-seg').forEach((t, i) => t.classList.toggle('active', i === index));
            document.querySelectorAll('.dashboard').forEach((d, i) => d.classList.toggle('active', i === index));
            updateTopBarTitle();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => window.dispatchEvent(new Event('scroll')), 300);
        }

        function setupSettings() {
            const overlay = document.getElementById('settingsOverlay');
            const openBtn = document.getElementById('settingsBtn');
            const closeBtn = document.getElementById('settingsClose');
            const open = () => {
                overlay.classList.add('open');
                closeBtn.focus();
            };
            const close = () => {
                if (!overlay.classList.contains('open')) return;
                overlay.classList.remove('open');
                openBtn.focus();
            };
            openBtn.addEventListener('click', open);
            closeBtn.addEventListener('click', close);
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) close();
            });
            overlay.closeSettings = close;
        }

        function applySummerBreakFromData(active) {
            if (active) {
                document.body.classList.add('summer-break');
                let banner = document.getElementById('summerBreakBanner');
                if (!banner) {
                    banner = document.createElement('div');
                    banner.id = 'summerBreakBanner';
                    banner.className = 'summer-break-banner';
                    const resume = formatSessionDay(currentData && currentData.school_session && currentData.school_session.next_first_day)
                        || formatSessionDay(currentData && currentData.school_session && currentData.school_session.first_day)
                        || 'on the first instructional day';
                    banner.textContent = `School is out — Aeries scrape and Grok are paused (TUSD calendar). Showing last school-year grades and attendance. Resumes ${resume}.`;
                    const picker = document.getElementById('studentPicker');
                    picker.parentNode.insertBefore(banner, picker.nextSibling);
                }
            } else {
                document.body.classList.remove('summer-break');
                const banner = document.getElementById('summerBreakBanner');
                if (banner) banner.remove();
            }
            updateTonightSticky();
            window.dispatchEvent(new Event('scroll'));
        }

        function setupKeyboard() {
            document.addEventListener('keydown', (e) => {
                const tag = (e.target && e.target.tagName) || '';
                if (tag === 'INPUT' || tag === 'TEXTAREA' || e.target.isContentEditable) return;
                if (e.key === 'Escape') {
                    const overlay = document.getElementById('settingsOverlay');
                    if (overlay.closeSettings) overlay.closeSettings();
                    else overlay.classList.remove('open');
                    return;
                }
                if (e.key === '1' || e.key === '2') {
                    const idx = parseInt(e.key, 10) - 1;
                    if (currentData && currentData.students && currentData.students[idx]) {
                        switchStudent(idx);
                    }
                }
            });
        }

        function renderLastUpdated(data) {
            const el = document.getElementById('lastUpdated');
            const updated = new Date(data.last_updated);
            if (Number.isNaN(updated.getTime())) {
                el.textContent = '';
                el.className = 'last-updated';
                return;
            }
            const opts = { timeZone: 'America/Los_Angeles' };
            const now = new Date();
            const isToday = updated.toLocaleDateString('en-US', opts) === now.toLocaleDateString('en-US', opts);
            const timeStr = updated.toLocaleTimeString('en-US', { ...opts, hour: 'numeric', minute: '2-digit' });
            const ageH = (now - updated) / 3600000;
            const summer = !!data.summer_break;
            // Scrapes land ~3× a day; anything older than a day means a run failed.
            const stale = !summer && ageH > 20;
            const veryStale = !summer && ageH > 44;
            const when = isToday
                ? `today ${timeStr}`
                : `${updated.toLocaleDateString('en-US', { ...opts, month: 'short', day: 'numeric' })} ${timeStr}`;
            el.textContent = veryStale
                ? `Not updated since ${when}`
                : `Updated ${when}`;
            el.className = `last-updated${veryStale ? ' very-stale' : (stale ? ' stale' : '')}`;
        }

        function expandedRowIds() {
            return Array.from(document.querySelectorAll('.class-row.expanded')).map(el => el.id);
        }

        function restoreExpandedRows(ids) {
            for (const id of ids) {
                const row = document.getElementById(id);
                if (!row) continue;
                row.classList.add('expanded');
                const btn = row.querySelector('.class-row-btn');
                if (btn) btn.setAttribute('aria-expanded', 'true');
            }
        }

        function paint(data, opts) {
            if (typeof data.summer_break === 'undefined') data.summer_break = false;
            const force = !!(opts && opts.force);
            // Rebuilding the DOM collapses open rows and resets scroll; skip when nothing changed.
            if (!force && lastPaintedStamp && data.last_updated === lastPaintedStamp) {
                currentData = data;
                renderLastUpdated(data);
                return;
            }
            lastPaintedStamp = data.last_updated;
            currentData = data;
            applySummerBreakFromData(!!data.summer_break);
            renderLastUpdated(data);

            const pickerEl = document.getElementById('studentPicker');
            const dashboardsEl = document.getElementById('dashboards');
            const keepIndex = activeStudentIndex;
            const keepExpanded = expandedRowIds();
            const keepScroll = window.scrollY;
            dashboardsEl.innerHTML = '';
            pickerEl.innerHTML = '';

            data.students.forEach((student, i) => {
                const seg = document.createElement('button');
                seg.className = `student-seg ${i === keepIndex ? 'active' : ''}`;
                seg.textContent = student.name;
                seg.addEventListener('click', () => switchStudent(i));
                pickerEl.appendChild(seg);

                const dashboard = document.createElement('div');
                dashboard.className = `dashboard ${i === keepIndex ? 'active' : ''}`;
                dashboard.id = `dashboard-${i}`;
                dashboard.innerHTML = renderStudent(student, i);
                dashboardsEl.appendChild(dashboard);
            });

            pickerEl.style.display = data.students.length < 2 ? 'none' : '';
            if (keepIndex >= data.students.length) activeStudentIndex = 0;
            restoreExpandedRows(keepExpanded);
            if (keepExpanded.length && keepScroll > 0) window.scrollTo({ top: keepScroll, behavior: 'auto' });
            updateTopBarTitle();
            syncTopBarHeight();
            window.dispatchEvent(new Event('scroll'));
        }

        function parsePeriodAttr(raw) {
            if (raw === '' || raw == null) return null;
            const n = Number(raw);
            return Number.isNaN(n) ? null : n;
        }

        function setupClassCards() {
            const dashboardsEl = document.getElementById('dashboards');
            dashboardsEl.addEventListener('click', (e) => {
                const jump = e.target.closest('[data-jump-period]');
                if (jump) {
                    jumpToClass(Number(jump.dataset.jumpStudent), parsePeriodAttr(jump.dataset.jumpPeriod));
                    return;
                }
                const collapse = e.target.closest('.panel-collapse');
                if (collapse) {
                    const row = collapse.closest('.class-row');
                    const rowBtn = row && row.querySelector('.class-row-btn');
                    if (row && rowBtn) {
                        toggleClassCard(Number(rowBtn.dataset.studentIdx), parsePeriodAttr(rowBtn.dataset.period));
                        const y = row.getBoundingClientRect().top + window.scrollY - stickyOffset() - 10;
                        window.scrollTo({ top: y, behavior: 'smooth' });
                        rowBtn.focus({ preventScroll: true });
                    }
                    return;
                }
                const btn = e.target.closest('.class-row-btn');
                if (!btn) return;
                toggleClassCard(Number(btn.dataset.studentIdx), parsePeriodAttr(btn.dataset.period));
            });
        }

        // The header's real height depends on font size and safe-area insets; keep the CSS variable honest.
        function syncTopBarHeight() {
            const topBar = document.querySelector('.top-bar');
            if (!topBar) return;
            const h = Math.round(topBar.getBoundingClientRect().height);
            if (h > 0) document.documentElement.style.setProperty('--top-bar-h', `${h}px`);
        }

        function stickyOffset() {
            const topBar = document.querySelector('.top-bar');
            const sticky = document.getElementById('tonightSticky');
            const stickyH = (sticky && sticky.classList.contains('visible')) ? sticky.offsetHeight : 0;
            return (topBar ? topBar.offsetHeight : 0) + stickyH;
        }

        function scheduleRefresh() {
            clearTimeout(refreshTimer);
            refreshTimer = setTimeout(() => refreshDashboard(), REFRESH_MS);
        }

        async function refreshDashboard() {
            const data = await loadData();
            if (data) paint(data);
            scheduleRefresh();
        }

        async function init() {
            const data = await loadData();
            if (!data) return null;
            activeStudentIndex = 0;
            syncTopBarHeight();
            paint(data, { force: true });
            if (!listenersBound) {
                setupSettings();
                setupTonightSticky();
                setupKeyboard();
                setupClassCards();
                window.addEventListener('resize', syncTopBarHeight, { passive: true });
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') refreshDashboard();
                });
                listenersBound = true;
            }
            scheduleRefresh();
            return data;
        }

        window.toggleClassCard = toggleClassCard;
        window.jumpToClass = jumpToClass;

        init();
    </script>
</body>
</html>
